<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>タイタニックの つうしんし</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Maru Gothic ProN', 'BIZ UDPGothic', 'MS PGothic', sans-serif;
      /* 夜の海のイメージ（紺色） */
      background: linear-gradient(180deg, #0B1D3A 0%, #123057 100%);
      min-height: 100dvh;
      color: #FFFFFF;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ─── ヘッダー ─────────────────────────── */
    .header {
      background: linear-gradient(135deg, #1E3A8A 0%, #312E81 100%);
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 3px 12px rgba(15, 23, 42, 0.5);
    }
    .back-btn {
      background: rgba(255,255,255,0.22);
      border: 1.5px solid rgba(255,255,255,0.4);
      color: white;
      font-size: 0.9rem;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
    }
    .back-btn:active { opacity: 0.7; }
    .header h1 { font-size: 1.15rem; font-weight: 900; }

    /* ─── 海のシーン（Canvas） ────────────── */
    .scene-wrap {
      position: relative;
      max-width: 560px;
      margin: 0 auto;
    }
    #scene {
      display: block;
      width: 100%;
      height: auto;
    }
    /* 電信のランプ（音が鳴っている あいだ ひかる） */
    .signal-lamp {
      position: absolute;
      top: 8px;
      right: 10px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #33415C;
      transition: background 0.05s, box-shadow 0.05s;
    }
    .signal-lamp.on {
      background: #FFD84D;
      box-shadow: 0 0 14px 4px rgba(255, 216, 77, 0.8);
    }
    /* クリアのお祝い（シーンの上にかさねる） */
    .scene-msg {
      position: absolute;
      top: 10px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 1.15rem;
      font-weight: 900;
      color: #FFD84D;
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
      display: none;
    }

    /* ─── 画面共通 ─────────────────────────── */
    .screen {
      display: none;
      padding: 14px 16px 40px;
      max-width: 560px;
      margin: 0 auto;
      text-align: center;
    }
    .screen.active { display: block; }

    .app-title {
      font-size: 1.5rem;
      font-weight: 900;
      color: #FFD84D;
      margin: 8px 0 4px;
    }
    .app-sub {
      font-size: 0.9rem;
      color: #B9C7DC;
      margin-bottom: 14px;
      line-height: 1.6;
    }
    .section-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #B9C7DC;
      margin: 12px 0 8px;
    }

    /* ボタン共通 */
    button {
      font-family: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.45; transform: none; cursor: default; }

    /* ─── ホーム画面 ───────────────────────── */
    .mode-toggle {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 14px;
    }
    .mode-toggle button {
      flex: 1;
      max-width: 180px;
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 16px;
      padding: 12px 8px;
      font-size: 1rem;
      font-weight: 900;
      background: rgba(255,255,255,0.08);
      color: #B9C7DC;
    }
    .mode-toggle button.selected {
      background: #FFD84D;
      border-color: #FFD84D;
      color: #1A2735;
    }

    .level-btns { display: flex; flex-direction: column; gap: 12px; }
    .level-btn {
      border: none;
      border-radius: 18px;
      padding: 16px 18px;
      font-size: 1.05rem;
      font-weight: 900;
      color: white;
      background: linear-gradient(135deg, #2563EB, #1E40AF);
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      line-height: 1.4;
    }
    .level-btn .lv-num {
      background: rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 6px 10px;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .level-btn.locked {
      background: #33415C;
      color: #8494AB;
      box-shadow: none;
    }
    .level-btn.locked:active { transform: none; }
    .level-btn .lv-best {
      margin-left: auto;
      font-size: 0.8rem;
      color: #FFD84D;
      white-space: nowrap;
    }

    /* ─── きくモード ───────────────────────── */
    .code-display {
      background: rgba(0,0,0,0.3);
      border-radius: 18px;
      padding: 14px 10px;
      margin-bottom: 12px;
      min-height: 108px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }
    .code-letter { font-size: 1.2rem; font-weight: 900; color: #FFFFFF; }
    .code-symbols {
      font-size: 2rem;
      font-weight: 900;
      color: #FFD84D;
      letter-spacing: 2px;
      line-height: 1.2;
      word-break: keep-all;
    }
    .code-totsu { font-size: 1.15rem; font-weight: 900; color: #FFFFFF; }

    .letter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .letter-btn {
      border: none;
      border-radius: 18px;
      padding: 16px 6px;
      font-size: 1.5rem;   /* 文字ボタンは大きく */
      font-weight: 900;
      color: white;
      background: linear-gradient(135deg, #2563EB, #1E40AF);
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    }
    .letter-btn small { font-size: 0.95rem; }

    .sub-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .sub-btn {
      border: none;
      border-radius: 999px;
      padding: 13px 18px;
      font-size: 0.98rem;
      font-weight: 900;
      color: white;
      background: rgba(255,255,255,0.14);
      border: 1.5px solid rgba(255,255,255,0.3);
    }
    .sub-btn.sos { background: linear-gradient(135deg, #DC2626, #B91C1C); border: none; }

    /* ─── クイズ画面 ───────────────────────── */
    .quiz-count { font-size: 0.9rem; font-weight: 700; color: #B9C7DC; margin-bottom: 6px; }
    .quiz-question { font-size: 1.15rem; font-weight: 900; margin-bottom: 8px; }
    .quiz-feedback {
      min-height: 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      margin-bottom: 8px;
    }
    .feedback-main { font-size: 1.05rem; font-weight: 900; color: #FFD84D; line-height: 1.5; }
    .feedback-main.miss { color: #FFFFFF; }
    .feedback-trivia { font-size: 0.82rem; color: #B9C7DC; line-height: 1.5; }

    .choice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .choice-btn {
      border: none;
      border-radius: 18px;
      padding: 18px 6px;
      font-size: 1.4rem;
      font-weight: 900;
      color: white;
      background: linear-gradient(135deg, #2563EB, #1E40AF);
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    }
    .choice-btn small { font-size: 0.9rem; }

    /* ─── SOS送信画面 ──────────────────────── */
    .sos-title { font-size: 1.3rem; font-weight: 900; color: #FFD84D; margin: 6px 0 2px; }
    .sos-sub { font-size: 0.9rem; color: #B9C7DC; margin-bottom: 10px; line-height: 1.6; }
    .sos-display {
      background: rgba(0,0,0,0.3);
      border-radius: 18px;
      padding: 16px 10px;
      margin-bottom: 6px;
      font-size: 2rem;
      font-weight: 900;
      color: #FFD84D;
      letter-spacing: 3px;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-all;
      line-height: 1.3;
    }
    .sos-feedback { min-height: 44px; font-size: 0.95rem; font-weight: 900; color: #FFFFFF; line-height: 1.5; margin-bottom: 6px; }
    .key-btns { display: flex; gap: 12px; margin-bottom: 14px; }
    .key-btn {
      flex: 1;
      border: none;
      border-radius: 20px;
      padding: 22px 6px;
      font-size: 1.5rem;
      font-weight: 900;
      color: white;
      box-shadow: 0 5px 16px rgba(0,0,0,0.4);
    }
    .key-btn.dot  { background: linear-gradient(135deg, #F59E0B, #D97706); }
    .key-btn.dash { background: linear-gradient(135deg, #EF4444, #B91C1C); }
    .key-btn small { font-size: 0.9rem; }
    .send-btn {
      width: 100%;
      border: none;
      border-radius: 20px;
      padding: 16px;
      font-size: 1.2rem;
      font-weight: 900;
      color: #1A2735;
      background: linear-gradient(135deg, #FFD84D, #F59E0B);
      box-shadow: 0 5px 16px rgba(0,0,0,0.4);
      margin-bottom: 12px;
    }

    /* ─── 結果・クリア画面 ─────────────────── */
    .result-icon { font-size: 3.6rem; margin: 10px 0 4px; }
    .result-score { font-size: 1.6rem; font-weight: 900; margin-bottom: 8px; }
    .result-score b { color: #FFD84D; font-size: 2.2rem; }
    .result-msg { font-size: 1rem; font-weight: 900; line-height: 1.7; margin-bottom: 18px; color: #FFD84D; }
    .result-msg.miss { color: #FFFFFF; }
    .big-btn {
      width: 100%;
      border: none;
      border-radius: 20px;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 900;
      color: white;
      background: linear-gradient(135deg, #2563EB, #1E40AF);
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      margin-bottom: 12px;
    }
    .big-btn.gold {
      background: linear-gradient(135deg, #FFD84D, #F59E0B);
      color: #1A2735;
    }
  </style>
  <!-- ポイント共通ライブラリ（各アプリで共通のポイント/記録機能） -->
  <script src="../../shared/points.js"></script>
</head>
<body>

<!-- ヘッダー -->
<div class="header">
  <button class="back-btn" onclick="handleBack()">‹ もどる</button>
  <h1>📡 タイタニックの つうしんし</h1>
</div>

<!-- 海のシーン（星空・波・2隻の船） -->
<div class="scene-wrap">
  <canvas id="scene" width="720" height="170"></canvas>
  <div class="signal-lamp" id="signal-lamp"></div>
  <div class="scene-msg" id="scene-msg">みんなを たすけられた！🎉</div>
</div>

<!-- ① ホーム画面 -->
<div class="screen active" id="screen-home">
  <div class="app-title">タイタニックの つうしんし</div>
  <div class="app-sub">モールスしんごうを おぼえて<br>きゅうじょを よぼう！</div>

  <div class="mode-toggle">
    <button id="mode-listen" class="selected" onclick="setMode('listen')">🎧 きく モード</button>
    <button id="mode-quiz" onclick="setMode('quiz')">❓ クイズ モード</button>
  </div>

  <div class="section-label">レベルを えらんでね</div>
  <div class="level-btns" id="level-btns"></div>
</div>

<!-- ② きくモード -->
<div class="screen" id="screen-listen">
  <div class="section-label" id="listen-title"></div>
  <div class="code-display">
    <div class="code-letter" id="listen-letter">もじを おしてみよう</div>
    <div class="code-symbols" id="listen-symbols"></div>
    <div class="code-totsu" id="listen-totsu"></div>
  </div>
  <div class="letter-grid" id="listen-grid"></div>
  <div class="sub-btns">
    <button class="sub-btn sos" onclick="listenSOS()">🚨 SOS をきく</button>
    <button class="sub-btn" onclick="goHome()">⛵ ホームへ</button>
  </div>
</div>

<!-- ③ クイズ画面 -->
<div class="screen" id="screen-quiz">
  <div class="quiz-count" id="quiz-count"></div>
  <div class="quiz-question">いまの おとは どのもじかな？</div>
  <div class="quiz-feedback">
    <div class="feedback-main" id="quiz-feedback"></div>
    <div class="feedback-trivia" id="quiz-trivia"></div>
  </div>
  <div class="choice-grid" id="choice-grid"></div>
  <div class="sub-btns">
    <button class="sub-btn" onclick="replayQuestion()">🔁 もういちど きく</button>
    <button class="sub-btn" onclick="goHome()">⛵ ホームへ</button>
  </div>
</div>

<!-- ④ SOS送信画面（レベル4の特別クイズ） -->
<div class="screen" id="screen-sos">
  <div class="sos-title">🚨 きゅうじょを よぼう！</div>
  <div class="sos-sub">SOS を ただしい じゅんばんで おそう</div>
  <div class="sos-display" id="sos-display">＿</div>
  <div class="sos-feedback" id="sos-feedback"></div>
  <div class="key-btns">
    <button class="key-btn dot" onclick="sosPress('.')">ト<br><small>（・）</small></button>
    <button class="key-btn dash" onclick="sosPress('-')">ツー<br><small>（－）</small></button>
  </div>
  <button class="send-btn" onclick="sosSend()">📡 そうしん！</button>
  <div class="sub-btns">
    <button class="sub-btn" onclick="sosClear()">🧹 けす</button>
    <button class="sub-btn" onclick="playCode(SOS_CODE)">🎧 SOS をきく</button>
    <button class="sub-btn" onclick="goHome()">⛵ ホームへ</button>
  </div>
</div>

<!-- ⑤ クイズの結果画面 -->
<div class="screen" id="screen-result">
  <div class="result-icon" id="result-icon">🏁</div>
  <div class="result-score"><b id="result-score">0</b> ／ 10もん せいかい！</div>
  <div class="result-msg" id="result-msg"></div>
  <button class="big-btn gold" id="result-retry" onclick="retryQuiz()">🔁 もういちど あそぶ</button>
  <button class="big-btn" onclick="goHome()">⛵ ホームへ もどる</button>
</div>

<!-- ⑥ レベル4クリアのお祝い画面 -->
<div class="screen" id="screen-clear">
  <div class="result-icon">🎉</div>
  <div class="app-title">だいせいこう！</div>
  <div class="result-msg">カルパチアごうが きたよ！<br>みんなを たすけられた！</div>
  <div class="app-sub">きみは りっぱな つうしんしだ！</div>
  <button class="big-btn" onclick="goHome()">⛵ ホームへ もどる</button>
</div>

<script>
/* ════════════════════════════════════════════════════════════════
 *  モールス符号のデータ
 * ════════════════════════════════════════════════════════════════ */

// 全26文字の辞書（将来レベルを増やせるように全部持っておく）
// 形式: 文字 → { yomi: カタカナ読み, code: 符号 }
const MORSE_ALL = {
  A: { yomi: 'エー',      code: '.-'   },
  B: { yomi: 'ビー',      code: '-...' },
  C: { yomi: 'シー',      code: '-.-.' },
  D: { yomi: 'ディー',    code: '-..'  },
  E: { yomi: 'イー',      code: '.'    },
  F: { yomi: 'エフ',      code: '..-.' },
  G: { yomi: 'ジー',      code: '--.'  },
  H: { yomi: 'エイチ',    code: '....' },
  I: { yomi: 'アイ',      code: '..'   },
  J: { yomi: 'ジェー',    code: '.---' },
  K: { yomi: 'ケー',      code: '-.-'  },
  L: { yomi: 'エル',      code: '.-..' },
  M: { yomi: 'エム',      code: '--'   },
  N: { yomi: 'エヌ',      code: '-.'   },
  O: { yomi: 'オー',      code: '---'  },
  P: { yomi: 'ピー',      code: '.--.' },
  Q: { yomi: 'キュー',    code: '--.-' },
  R: { yomi: 'アール',    code: '.-.'  },
  S: { yomi: 'エス',      code: '...'  },
  T: { yomi: 'ティー',    code: '-'    },
  U: { yomi: 'ユー',      code: '..-'  },
  V: { yomi: 'ブイ',      code: '...-' },
  W: { yomi: 'ダブリュー', code: '.--'  },
  X: { yomi: 'エックス',  code: '-..-' },
  Y: { yomi: 'ワイ',      code: '-.--' },
  Z: { yomi: 'ゼット',    code: '--..' },
};

// SOSの符号（文字のあいだはスペースで区切る）
const SOS_CODE = '... --- ...';

// レベル構成（航海になぞらえる）
const LEVELS = {
  1: { name: 'しゅっこうまえの くんれん',     letters: ['E', 'T', 'I', 'M'] },
  2: { name: 'サウサンプトンを しゅっぱつ',   letters: ['E', 'T', 'I', 'M', 'A', 'N'] },
  3: { name: 'たいせいようを こうかいちゅう', letters: ['E', 'T', 'I', 'M', 'A', 'N', 'S', 'O'] },
  4: { name: 'カルパチアごうとの こうしん',   letters: ['E', 'T', 'I', 'M', 'A', 'N', 'S', 'O'] },
};

const QUIZ_COUNT = 10;   // クイズの問題数
const PASS_SCORE = 8;    // 次のレベルが解放される正解数

// 正解のときに1行ずつ出す豆知識（ひらがな・カタカナのみ）
const TRIVIA = [
  'SOSは おぼえやすいから えらばれたんだよ',
  'タイタニックごうには ほんものの つうしんしが ふたり いたんだよ',
  'むせんの おかげで やく700にんが たすかったんだよ',
  'Eの『ト』は いちばん みじかい もじなんだよ',
  'つうしんしは おとを きくだけで もじが わかるんだよ',
  'モールスしんごうは 150ねんいじょう まえに うまれたんだよ',
  'むかしの ふねは モールスしんごうで おはなし していたんだよ',
  'いまでも ふねや ひこうきの せかいで モールスは つかわれているよ',
];

/* ════════════════════════════════════════════════════════════════
 *  音の設定と再生（Web Audio API）
 *  ・電信音らしく 800Hz。短点120ms・長点360ms・間隔120ms
 *  ・スマホでは「タップしてから」でないと音が出せないので、
 *    ボタンを押したときに AudioContext を用意する
 * ════════════════════════════════════════════════════════════════ */

const FREQ = 800;          // 電信音の周波数（Hz）
const DOT_MS = 120;        // 短点「ト」の長さ
const DASH_MS = 360;       // 長点「ツー」の長さ
const GAP_MS = 120;        // 符号のあいだの間隔
const LETTER_GAP_MS = 360; // 文字と文字のあいだの間隔

let audioCtx = null;   // 音を出すための道具（最初のタップで作る）
let playing = false;   // 再生中フラグ（連打防止のロック）

/** AudioContext を用意する（無ければ作り、止まっていれば動かす） */
function ensureAudio() {
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {
    audioCtx = null;  // 音が出せない環境でも表示だけで動作を続ける
  }
}

/** 指定ミリ秒だけ待つ（async用） */
function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

/**
 * ピッという電信音を1回鳴らす。鳴っているあいだランプも光らせる。
 * @param {number} ms 鳴らす長さ（ミリ秒）
 */
async function beep(ms) {
  const lamp = document.getElementById('signal-lamp');
  lamp.classList.add('on');
  if (audioCtx) {
    try {
      // オシレーター（音の発生器）で 800Hz のサイン波を作る
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = FREQ;
      // プツッというノイズが出ないよう、音量をなめらかに上げ下げする
      const t = audioCtx.currentTime;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.3, t + 0.01);
      gain.gain.setValueAtTime(0.3, t + ms / 1000 - 0.02);
      gain.gain.linearRampToValueAtTime(0, t + ms / 1000);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + ms / 1000);
    } catch (e) { /* 音が出なくても続ける */ }
  }
  await sleep(ms);
  lamp.classList.remove('on');
}

/**
 * まえの音が鳴りおわるのを待ってから、符号を再生する。
 * クイズの「もんだいの音」など、かならず鳴らしたい音に使う。
 * （playCode は連打防止のため、鳴っている最中によぶと何もしない。
 *   そのままだと「SOSを聞いた直後にクイズを始めると1問目が無音になる」
 *   ので、こちらは空くまで少しずつ待ってから鳴らす）
 * @param {string} code 符号の文字列
 */
function playCodeWhenFree(code, tries = 50) {
  if (!playing) {
    playCode(code);
  } else if (tries > 0) {
    setTimeout(() => playCodeWhenFree(code, tries - 1), 200);
  }
}

/**
 * 符号（'.-' や '... --- ...'）をまとめて再生する。
 * @param {string} code 符号の文字列
 */
async function playCode(code) {
  if (playing) return;   // 再生中は連打できないようにロック
  ensureAudio();
  playing = true;
  try {
    for (const ch of code) {
      if (ch === '.') {
        await beep(DOT_MS);
        await sleep(GAP_MS);
      } else if (ch === '-') {
        await beep(DASH_MS);
        await sleep(GAP_MS);
      } else {
        await sleep(LETTER_GAP_MS);  // スペース＝文字の区切り
      }
    }
  } finally {
    playing = false;   // どんなときでも必ずロックを解除する
  }
}

/* ════════════════════════════════════════════════════════════════
 *  符号の表示変換
 * ════════════════════════════════════════════════════════════════ */

/** 符号（'.-'）を大きな記号（'・－'）に変換する */
function codeToSymbols(code) {
  return [...code].map(ch =>
    ch === '.' ? '・' : ch === '-' ? '－' : '　').join('');
}

/** 符号（'.-'）をトツー読み（'ト ツー'）に変換する */
function codeToTotsu(code) {
  return [...code].map(ch =>
    ch === '.' ? 'ト' : ch === '-' ? 'ツー' : '/').join(' ');
}

/* ════════════════════════════════════════════════════════════════
 *  進捗の保存（localStorage）
 * ════════════════════════════════════════════════════════════════ */

const PROGRESS_KEY = 'morse_progress';

/** 進捗データの初期値 */
function defaultProgress() {
  return {
    unlocked_level: 1,                              // 解放ずみのレベル
    correct_total: 0,                               // いままでの正解の合計
    level_scores: { 1: 0, 2: 0, 3: 0, 4: 0 },      // レベルごとのベストスコア
  };
}

/** 進捗を読み込む（壊れていたり無ければ初期値を使う） */
function loadProgress() {
  try {
    const data = JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null');
    if (!data) return defaultProgress();
    // 欠けているキーは初期値で補う（エラーで落ちないように）
    const base = defaultProgress();
    for (const key of Object.keys(base)) {
      if (data[key] === undefined) data[key] = base[key];
    }
    return data;
  } catch (e) {
    return defaultProgress();
  }
}

/** 進捗を保存する（失敗しても遊びは続けられるようにする） */
function saveProgress() {
  try {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
  } catch (e) { /* 保存できなくても続ける */ }
}

let progress = loadProgress();

/* ════════════════════════════════════════════════════════════════
 *  海のシーンの描画（Canvas）
 *  星空・月・波・タイタニック号・カルパチア号
 *  クイズに正解するたびに カルパチア号が右から少しずつ近づく
 * ════════════════════════════════════════════════════════════════ */

const SCENE_W = 720, SCENE_H = 170;   // 描画の基準サイズ（CSSで縮小表示）
const CARP_START_X = 545;             // カルパチア号の最初の位置
const CARP_GOAL_X = 330;              // タイタニック号のとなり（ゴール）

// 星の位置は毎回同じにする（かんたんな疑似乱数で固定）
const STARS = [];
(function () {
  let seed = 42;
  const rnd = () => {
    seed = (seed * 1103515245 + 12345) % 2147483648;
    return seed / 2147483648;
  };
  for (let i = 0; i < 40; i++) {
    STARS.push([10 + rnd() * (SCENE_W - 20), 6 + rnd() * 60]);
  }
})();

/** カルパチア号のいまの位置。正解が増えるほど近づいてくる */
function carpathiaX() {
  if ((progress.level_scores[4] || 0) >= 1) return CARP_GOAL_X;  // クリア後はずっととなり
  return Math.max(CARP_GOAL_X, CARP_START_X - progress.correct_total * 5);
}

/** シーン全体を描き直す */
function drawScene(celebrate) {
  const cv = document.getElementById('scene');
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, SCENE_W, SCENE_H);

  // 夜空
  ctx.fillStyle = '#0B1D3A';
  ctx.fillRect(0, 0, SCENE_W, SCENE_H);

  // 星
  ctx.fillStyle = '#FFFFFF';
  for (const [x, y] of STARS) {
    ctx.beginPath();
    ctx.arc(x, y, 1.3, 0, Math.PI * 2);
    ctx.fill();
  }

  // 月（三日月）
  ctx.fillStyle = '#F5EFC9';
  ctx.beginPath();
  ctx.arc(660, 34, 18, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#0B1D3A';
  ctx.beginPath();
  ctx.arc(652, 30, 16, 0, Math.PI * 2);
  ctx.fill();

  // 海
  const seaTop = 108;
  ctx.fillStyle = '#123057';
  ctx.fillRect(0, seaTop, SCENE_W, SCENE_H - seaTop);

  // 波の線
  ctx.strokeStyle = '#2C4A7A';
  ctx.lineWidth = 2;
  for (const wy of [seaTop + 18, seaTop + 34, seaTop + 50]) {
    for (let wx = 0; wx < SCENE_W; wx += 72) {
      ctx.beginPath();
      ctx.arc(wx + 28, wy, 26, Math.PI, 0);
      ctx.stroke();
    }
  }

  // タイタニック号（左・煙突4本）とカルパチア号（右から近づく・煙突1本）
  drawShip(ctx, 40, seaTop + 4, 1.0, 4);
  drawShip(ctx, carpathiaX(), seaTop + 8, 0.62, 1);

  // レベル4クリアのお祝い表示
  document.getElementById('scene-msg').style.display = celebrate ? 'block' : 'none';
}

/**
 * 船のシルエットを1隻描く。
 * @param {CanvasRenderingContext2D} ctx 描画用の道具
 * @param {number} x 船首の左の位置
 * @param {number} y 甲板の高さ
 * @param {number} s 大きさ（1.0でタイタニックサイズ）
 * @param {number} funnels 煙突の本数（タイタニックは4本）
 */
function drawShip(ctx, x, y, s, funnels) {
  // 船体（下がすぼんだ台形）
  ctx.fillStyle = '#1A2735';
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + 230 * s, y);
  ctx.lineTo(x + 214 * s, y + 26 * s);
  ctx.lineTo(x + 16 * s, y + 26 * s);
  ctx.closePath();
  ctx.fill();
  // 上部のデッキ
  ctx.fillRect(x + 34 * s, y - 16 * s, 162 * s, 16 * s);
  // 煙突
  ctx.fillStyle = '#33415C';
  const gap = (130 * s) / Math.max(funnels, 1);
  let fx = x + 52 * s;
  for (let i = 0; i < funnels; i++) {
    ctx.fillRect(fx, y - 44 * s, 16 * s, 28 * s);
    fx += gap;
  }
  // あかり（丸い窓）
  ctx.fillStyle = '#FFD84D';
  for (let wx = x + 44 * s; wx < x + 190 * s; wx += 24 * s) {
    ctx.beginPath();
    ctx.arc(wx, y - 8 * s, 2.2 * s, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ════════════════════════════════════════════════════════════════
 *  画面の切り替えとホーム画面
 * ════════════════════════════════════════════════════════════════ */

let mode = 'listen';       // いま選ばれているモード（listen / quiz）
let currentScreen = 'home';

/** 指定した画面だけを表示する */
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  currentScreen = name;
}

/** ホームに戻る */
function goHome() {
  drawScene(false);
  renderHome();
  showScreen('home');
}

/** ヘッダーの「もどる」。ホーム以外ならホームへ、ホームならランチャーへ */
function handleBack() {
  if (currentScreen !== 'home') {
    goHome();
  } else {
    location.href = '../../index.html';
  }
}

/** モード（きく／クイズ）を切り替える */
function setMode(m) {
  mode = m;
  document.getElementById('mode-listen').classList.toggle('selected', m === 'listen');
  document.getElementById('mode-quiz').classList.toggle('selected', m === 'quiz');
}

/** ホーム画面のレベルボタンを作り直す */
function renderHome() {
  const wrap = document.getElementById('level-btns');
  wrap.innerHTML = '';
  for (const lv of [1, 2, 3, 4]) {
    const info = LEVELS[lv];
    const btn = document.createElement('button');
    const unlocked = lv <= progress.unlocked_level;
    btn.className = 'level-btn' + (unlocked ? '' : ' locked');
    const best = progress.level_scores[lv] || 0;
    const bestHtml = (unlocked && best > 0)
      ? `<span class="lv-best">⭐ ${lv === 4 ? 'クリア！' : `ベスト ${best}てん`}</span>` : '';
    btn.innerHTML =
      `<span class="lv-num">${unlocked ? '' : '🔒 '}レベル${lv}</span>` +
      `<span>${info.name}</span>` + bestHtml;
    if (unlocked) {
      btn.onclick = () => startLevel(lv);
    } else {
      btn.disabled = true;
    }
    wrap.appendChild(btn);
  }
}

/** 選ばれたレベルを、いまのモードで開始する */
function startLevel(lv) {
  ensureAudio();  // タップのタイミングで音の準備をしておく（スマホ対策）
  if (mode === 'listen') {
    showListen(lv);
  } else if (lv === 4) {
    showSosQuiz();       // レベル4はSOS送信の特別クイズ
  } else {
    startQuiz(lv);
  }
}

/* ════════════════════════════════════════════════════════════════
 *  きくモード（学習）
 * ════════════════════════════════════════════════════════════════ */

let listenLevel = 1;

/** きくモードの画面を組み立てる */
function showListen(lv) {
  listenLevel = lv;
  document.getElementById('listen-title').textContent =
    `🎧 きくモード　レベル${lv} ${LEVELS[lv].name}`;
  document.getElementById('listen-letter').textContent = 'もじを おしてみよう';
  document.getElementById('listen-symbols').textContent = '';
  document.getElementById('listen-totsu').textContent = '';

  const grid = document.getElementById('listen-grid');
  grid.innerHTML = '';
  for (const letter of LEVELS[lv].letters) {
    const { yomi } = MORSE_ALL[letter];
    const btn = document.createElement('button');
    btn.className = 'letter-btn';
    btn.innerHTML = `${letter} <small>（${yomi}）</small>`;
    btn.onclick = () => listenLetter(letter);
    grid.appendChild(btn);
  }
  showScreen('listen');
}

/** 文字ボタンが押されたら 符号表示 + トツー読み + 音 を同時に行う */
function listenLetter(letter) {
  if (playing) return;
  const { yomi, code } = MORSE_ALL[letter];
  document.getElementById('listen-letter').textContent = `${letter}（${yomi}）`;
  document.getElementById('listen-symbols').textContent = codeToSymbols(code);
  document.getElementById('listen-totsu').textContent = codeToTotsu(code);
  playCode(code);
}

/** SOS（トトト ツーツーツー トトト）を表示して鳴らす */
function listenSOS() {
  if (playing) return;
  document.getElementById('listen-letter').textContent = 'SOS';
  document.getElementById('listen-symbols').textContent = codeToSymbols(SOS_CODE);
  document.getElementById('listen-totsu').textContent = codeToTotsu(SOS_CODE);
  playCode(SOS_CODE);
}

/* ════════════════════════════════════════════════════════════════
 *  クイズモード（レベル1〜3）
 *  ・音だけを聞いて4択から文字を当てる
 *  ・まちがえても正解は教えず、もういちど聞いて再挑戦できる
 *  ・点数に入るのは「1回目で正解できたか」だけ
 * ════════════════════════════════════════════════════════════════ */

let quizLevel = 1;    // いま遊んでいるレベル
let qNum = 0;         // いま何問目か
let qScore = 0;       // 正解数（1回目の答えで数える）
let qLetter = null;   // いまの問題の正解の文字
let qFirstTry = true; // この問題を1回目で答えられるか
let triviaIndex = 0;  // 豆知識を順番に出すためのカウンター

/** クイズを最初から始める */
function startQuiz(lv) {
  quizLevel = lv;
  qNum = 0;
  qScore = 0;
  qLetter = null;
  Stats.beginPlay();   // かかった時間の記録を始める（管理ページ用）
  nextQuestion();
}

/** 次の問題を出す。10問終わったら結果画面へ */
function nextQuestion() {
  if (qNum >= QUIZ_COUNT) {
    showQuizResult();
    return;
  }
  qNum++;
  qFirstTry = true;

  const letters = LEVELS[quizLevel].letters;
  // 前の問題と同じ文字が続かないように選ぶ
  const candidates = letters.filter(l => l !== qLetter);
  qLetter = candidates[Math.floor(Math.random() * candidates.length)];

  // 4択の選択肢を作る（正解 + まちがい3つをシャッフル）
  const wrongs = letters.filter(l => l !== qLetter);
  // まちがいの選択肢をランダムに3つ選ぶ
  for (let i = wrongs.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [wrongs[i], wrongs[j]] = [wrongs[j], wrongs[i]];
  }
  const choices = wrongs.slice(0, 3).concat(qLetter);
  for (let i = choices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [choices[i], choices[j]] = [choices[j], choices[i]];
  }

  buildQuizScreen(choices);
  Stats.lapStart();   // 1問ぶんの時間の計測スタート
  // 少し間をおいて自動で音を鳴らす
  // （まえの音が鳴りおわっていないときは、おわるのを待ってから鳴らす）
  setTimeout(() => playCodeWhenFree(MORSE_ALL[qLetter].code), 400);
}

/** クイズ1問ぶんの画面を組み立てる */
function buildQuizScreen(choices) {
  document.getElementById('quiz-count').textContent =
    `❓ レベル${quizLevel} ${LEVELS[quizLevel].name}　（${qNum}／${QUIZ_COUNT}もんめ）`;
  document.getElementById('quiz-feedback').textContent = '';
  document.getElementById('quiz-feedback').className = 'feedback-main';
  document.getElementById('quiz-trivia').textContent = '';

  const grid = document.getElementById('choice-grid');
  grid.innerHTML = '';
  for (const letter of choices) {
    const { yomi } = MORSE_ALL[letter];
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `${letter} <small>（${yomi}）</small>`;
    btn.onclick = () => answerQuiz(letter, btn);
    grid.appendChild(btn);
  }
  showScreen('quiz');
}

/** いまの問題の音をもういちど鳴らす */
function replayQuestion() {
  if (qLetter) playCode(MORSE_ALL[qLetter].code);
}

/** 4択の答え合わせ */
function answerQuiz(letter) {
  const fb = document.getElementById('quiz-feedback');
  if (letter === qLetter) {
    // ---- 正解 ----
    const { yomi, code } = MORSE_ALL[letter];
    Stats.lap(qFirstTry);   // 1問ぶんの時間を記録（1回目で正解できたかも）
    if (qFirstTry) {
      qScore++;
      // 正解のたびにカルパチア号が少し近づく
      progress.correct_total++;
      saveProgress();
      drawScene(false);
    }
    fb.textContent = `せいかい！ ${letter}（${yomi}）は『${codeToTotsu(code)}』だよ`;
    fb.className = 'feedback-main';
    // 豆知識を順番に1行表示
    document.getElementById('quiz-trivia').textContent =
      '💡 ' + TRIVIA[triviaIndex % TRIVIA.length];
    triviaIndex++;
    // 答えたあとは選択肢を押せないようにして、少し待って次の問題へ
    document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
    setTimeout(nextQuestion, 2000);
  } else {
    // ---- 不正解（正解は教えず、もういちど聞いて再挑戦） ----
    qFirstTry = false;
    fb.textContent = 'ざんねん！ もういちど きいてみよう';
    fb.className = 'feedback-main miss';
    document.getElementById('quiz-trivia').textContent = '';
  }
}

/** 10問終了後の結果画面。8問以上で次のレベルを解放する */
function showQuizResult() {
  const passed = qScore >= PASS_SCORE;

  // 進捗を保存（ベストスコアとレベル解放）
  progress.level_scores[quizLevel] =
    Math.max(progress.level_scores[quizLevel] || 0, qScore);
  if (passed && progress.unlocked_level < quizLevel + 1) {
    progress.unlocked_level = quizLevel + 1;
  }
  saveProgress();
  drawScene(false);

  // きろくページ用に「正解数／問題数」を記録する
  Stats.record(qScore, QUIZ_COUNT);

  document.getElementById('result-icon').textContent = passed ? '🎖️' : '🏁';
  document.getElementById('result-score').textContent = qScore;
  const msg = document.getElementById('result-msg');
  if (passed) {
    msg.textContent = quizLevel < 4
      ? `すごい！ レベル${quizLevel + 1}が あそべるように なったよ！`
      : 'すごい！ りっぱな つうしんしだね！';
    msg.className = 'result-msg';
  } else {
    msg.textContent = 'おしい！ きくモードで れんしゅうして もういちど ちょうせんしよう';
    msg.className = 'result-msg miss';
  }
  showScreen('result');

  // 合格したらポイントをプレゼント（数は管理ツールで変えられる）
  if (passed) Points.rewardFor(3);
}

/** 結果画面の「もういちど あそぶ」 */
function retryQuiz() {
  startQuiz(quizLevel);
}

/* ════════════════════════════════════════════════════════════════
 *  レベル4特別クイズ（SOS送信）
 *  「ト」「ツー」の2つのボタンで ...---... を打てたらクリア
 * ════════════════════════════════════════════════════════════════ */

let sosInput = '';   // いままでに打った符号（'.' と '-'）

/** SOS送信画面を開く */
function showSosQuiz() {
  sosInput = '';
  document.getElementById('sos-display').textContent = '＿';
  document.getElementById('sos-feedback').textContent = '';
  showScreen('sos');
}

/** ト（.）または ツー（-）を1つ入力する */
function sosPress(symbol) {
  if (playing) return;
  if (sosInput.length >= 12) return;   // 打ちすぎ防止
  sosInput += symbol;
  document.getElementById('sos-display').textContent = codeToSymbols(sosInput);
  document.getElementById('sos-feedback').textContent = '';
  playCode(symbol);   // 押した符号の音も鳴らす
}

/** 入力した符号を消してやり直す */
function sosClear() {
  sosInput = '';
  document.getElementById('sos-display').textContent = '＿';
  document.getElementById('sos-feedback').textContent = '';
}

/** 打った符号がSOS（...---...）と一致するか判定する */
function sosSend() {
  if (sosInput === SOS_CODE.replace(/ /g, '')) {
    sosSuccess();
  } else {
    document.getElementById('sos-feedback').textContent =
      'ざんねん！ 『SOS をきく』で たしかめて もういちど おそう';
    sosInput = '';
    document.getElementById('sos-display').textContent = '＿';
  }
}

/** レベル4クリア！ カルパチア号が来る成功演出 */
function sosSuccess() {
  const firstClear = (progress.level_scores[4] || 0) < 1;

  // 進捗を保存（クリアの記録）
  progress.level_scores[4] = QUIZ_COUNT;
  progress.correct_total++;
  saveProgress();

  // 2隻が並ぶ + お祝い表示
  drawScene(true);
  showScreen('clear');
  Stats.record(1, 1);   // きろくページ用（SOSクイズ1問に正解）

  // クリアのよろこびの音（SOSをもういちど鳴らす）
  // 「そうしん」ボタンの直前に押した ト・ツーの音が残っていても
  // 鳴りおわりを待ってから鳴らす
  setTimeout(() => playCodeWhenFree(SOS_CODE), 500);
  // はじめてのクリアのときはポイントもプレゼント
  if (firstClear) setTimeout(() => Points.rewardFor(3), 2600);
}

/* ════════════════════════════════════════════════════════════════
 *  起動
 * ════════════════════════════════════════════════════════════════ */
drawScene(false);
renderHome();
</script>
