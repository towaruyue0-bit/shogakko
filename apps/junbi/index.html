<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>じゅんび チェック</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --clr-main:  #f97316;   /* テーマ色（オレンジ） */
      --clr-main2: #f59e0b;   /* テーマ色（きいろ） */
      --clr-ok:    #16a34a;
      --clr-ng:    #ef4444;
      --clr-text:  #2d3748;
      --clr-sub:   #64748b;
    }

    html, body { height: 100%; }
    body {
      font-family: 'Hiragino Maru Gothic ProN', 'BIZ UDPGothic', 'MS PGothic', sans-serif;
      background: linear-gradient(160deg, #fff4e6 0%, #fef9c3 100%);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--clr-text);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
    }

    /* ─── ヘッダー ─────────────────────────────────────── */
    .header {
      width: 100%;
      background: linear-gradient(135deg, var(--clr-main), var(--clr-main2));
      color: white;
      text-align: center;
      padding: 14px 16px 12px;
      position: relative;
      box-shadow: 0 3px 14px rgba(249,115,22,0.35);
      flex-shrink: 0;
    }
    .header h1 { font-size: 1.25rem; font-weight: 900; letter-spacing: 0.04em; }
    .back-btn {
      position: absolute;
      left: 12px; top: 50%;
      transform: translateY(-50%);
      color: white;
      text-decoration: none;
      font-size: 0.8rem;
      background: rgba(255,255,255,0.22);
      border: 1.5px solid rgba(255,255,255,0.4);
      border-radius: 20px;
      padding: 5px 12px;
    }
    .edit-btn {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      color: white;
      font-size: 1.1rem;
      background: rgba(255,255,255,0.22);
      border: 1.5px solid rgba(255,255,255,0.4);
      border-radius: 50%;
      width: 36px; height: 36px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-family: inherit;
    }
    .edit-btn.on { background: white; color: var(--clr-main); }

    /* ═══ 画面わく ═══════════════════════════════════════ */
    .screen {
      width: 100%;
      max-width: 460px;
      padding: 16px 16px 40px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ─── リストえらび（タブ） ───────────────────────── */
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 2px 6px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0;
      background: white;
      border: 2.5px solid transparent;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.95rem;
      font-weight: 900;
      color: var(--clr-sub);
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex; align-items: center; gap: 6px;
    }
    .tab .t-icon { font-size: 1.2rem; }
    .tab.active {
      border-color: var(--clr-main);
      color: var(--clr-main);
      background: #fff7ed;
    }
    .tab.add { color: var(--clr-main); border-style: dashed; border-color: #fdba74; background: transparent; box-shadow: none; }

    /* ─── すすみぐあいカード ─────────────────────────── */
    .progress-card {
      background: white;
      border-radius: 22px;
      padding: 18px 20px 16px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.08);
      display: flex; align-items: center; gap: 16px;
    }
    .progress-card .p-icon { font-size: 2.8rem; line-height: 1; }
    .progress-card .p-body { flex: 1; min-width: 0; }
    .progress-card .p-title { font-size: 1.15rem; font-weight: 900; }
    .progress-card .p-title input {
      width: 100%; font: inherit; border: 2px solid #fdba74; border-radius: 10px; padding: 4px 8px;
    }
    .progress-card .p-sub { font-size: 0.85rem; color: var(--clr-sub); font-weight: 800; margin-top: 2px; }
    .progress-card .p-sub b { color: var(--clr-main); font-size: 1.1rem; }
    .bar { height: 12px; background: #fde68a; border-radius: 999px; overflow: hidden; margin-top: 8px; }
    .bar > i {
      display: block; height: 100%;
      background: linear-gradient(90deg, var(--clr-main), #22c55e);
      border-radius: 999px;
      transition: width 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    }
    .progress-card.done .bar > i { background: #22c55e; }

    /* ─── もちものリスト ─────────────────────────────── */
    .list { display: flex; flex-direction: column; gap: 10px; }
    .item {
      background: white;
      border-radius: 18px;
      padding: 12px 14px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
      border: 2.5px solid transparent;
      cursor: pointer;
      transition: transform 0.12s, background 0.2s;
      min-height: 66px;
    }
    .item:active { transform: scale(0.97); }
    .item .i-icon { font-size: 2rem; width: 44px; text-align: center; line-height: 1; flex-shrink: 0; }
    .item .i-name { flex: 1; font-size: 1.15rem; font-weight: 900; }
    .item .i-check {
      width: 38px; height: 38px; border-radius: 50%;
      border: 3px solid #fdba74;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; color: white; flex-shrink: 0;
      transition: transform 0.2s;
    }
    .item.done { background: #f0fdf4; border-color: #86efac; }
    .item.done .i-name { color: #15803d; text-decoration: line-through; text-decoration-thickness: 3px; text-decoration-color: #86efac; }
    .item.done .i-check { background: var(--clr-ok); border-color: var(--clr-ok); animation: pop 0.3s cubic-bezier(0.18, 0.9, 0.3, 1.4); }
    .item.done .i-icon { opacity: 0.55; }
    @keyframes pop { 0% { transform: scale(0.4); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }

    /* へんしゅうモードのボタン */
    .item .i-tools { display: none; gap: 4px; flex-shrink: 0; }
    body.editing .item { cursor: default; }
    body.editing .item .i-check { display: none; }
    body.editing .item .i-tools { display: flex; }
    .tool-btn {
      width: 36px; height: 36px; border-radius: 10px;
      border: none; background: #f1f5f9; color: var(--clr-sub);
      font-size: 1rem; cursor: pointer; font-family: inherit;
      display: flex; align-items: center; justify-content: center;
    }
    .tool-btn:active { background: #e2e8f0; }
    .tool-btn.del { background: #fee2e2; color: var(--clr-ng); }
    .tool-btn:disabled { opacity: 0.3; }

    .empty { text-align: center; color: var(--clr-sub); font-weight: 800; padding: 30px 10px; }

    /* ─── ついかフォーム（へんしゅうモードだけ） ─────── */
    .add-box { display: none; background: white; border-radius: 18px; padding: 14px; box-shadow: 0 3px 12px rgba(0,0,0,0.07); gap: 10px; flex-direction: column; }
    body.editing .add-box { display: flex; }
    .add-box .ab-title { font-size: 0.9rem; font-weight: 900; color: var(--clr-sub); }
    .add-row { display: flex; gap: 8px; }
    .add-row input {
      font: inherit; font-weight: 800; border: 2px solid #e2e8f0; border-radius: 12px; padding: 10px 12px; min-width: 0;
    }
    .add-row input:focus { outline: none; border-color: var(--clr-main); }
    #new-icon { width: 64px; text-align: center; font-size: 1.4rem; padding: 6px; }
    #new-name { flex: 1; }
    .add-row .go {
      background: var(--clr-main); color: white; border: none; border-radius: 12px;
      font: inherit; font-weight: 900; padding: 0 16px; cursor: pointer;
    }
    .emoji-pal { display: flex; flex-wrap: wrap; gap: 6px; }
    .emoji-pal button {
      width: 40px; height: 40px; font-size: 1.35rem; border: 2px solid transparent;
      background: #f8fafc; border-radius: 10px; cursor: pointer;
    }
    .emoji-pal button.sel { border-color: var(--clr-main); background: #fff7ed; }

    .set-tools { display: none; gap: 8px; }
    body.editing .set-tools { display: flex; }
    .set-tools button {
      flex: 1; font: inherit; font-weight: 900; font-size: 0.85rem;
      border: 2px solid #e2e8f0; background: white; border-radius: 12px; padding: 10px; cursor: pointer;
    }
    .set-tools button.danger { color: var(--clr-ng); border-color: #fecaca; }

    /* ─── リセットボタン ─────────────────────────────── */
    .reset-btn {
      margin-top: 6px;
      background: white;
      border: 2.5px solid #fdba74;
      color: var(--clr-main);
      font: inherit; font-weight: 900; font-size: 1rem;
      border-radius: 16px; padding: 14px; cursor: pointer;
    }
    .reset-btn:active { background: #fff7ed; }
    body.editing .reset-btn { display: none; }

    /* ─── かんせい おいわい ─────────────────────────── */
    .celebrate {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(15,23,42,0.45);
      display: none; align-items: center; justify-content: center;
      padding: 24px;
      animation: fade 0.25s ease-out;
    }
    .celebrate.show { display: flex; }
    .celebrate .c-card {
      background: white; border-radius: 28px; padding: 30px 26px; text-align: center;
      box-shadow: 0 16px 50px rgba(0,0,0,0.3);
      animation: pop 0.5s cubic-bezier(0.18, 0.9, 0.3, 1.3);
      width: 100%; max-width: 340px;
    }
    .celebrate .c-emoji { font-size: 4rem; line-height: 1.1; }
    .celebrate .c-title { font-size: 1.6rem; font-weight: 900; color: var(--clr-main); margin: 10px 0 4px; }
    .celebrate .c-sub { font-size: 1rem; color: var(--clr-sub); font-weight: 800; }
    .celebrate .c-ok {
      margin-top: 20px; width: 100%;
      background: linear-gradient(135deg, var(--clr-main), var(--clr-main2));
      color: white; border: none; border-radius: 16px; padding: 14px;
      font: inherit; font-weight: 900; font-size: 1.1rem; cursor: pointer;
    }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    .confetti {
      position: fixed; top: -20px; width: 12px; height: 12px; z-index: 501;
      border-radius: 3px; pointer-events: none;
      animation: fall linear forwards;
    }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(720deg); opacity: 0.6; }
    }
  </style>
</head>
<body>
  <script src="../../shared/points.js"></script>

  <div class="header">
    <a class="back-btn" href="../../">← もどる</a>
    <h1>🧳 じゅんび チェック</h1>
    <button class="edit-btn" id="edit-btn" title="へんしゅう">✏️</button>
  </div>

  <div class="screen">
    <div class="tabs" id="tabs"></div>

    <div class="progress-card" id="progress"></div>

    <div class="set-tools" id="set-tools">
      <button id="rename-set">✏️ なまえを かえる</button>
      <button class="danger" id="delete-set">🗑 この リストを けす</button>
    </div>

    <div class="list" id="list"></div>

    <div class="add-box">
      <div class="ab-title">＋ もちものを ついか</div>
      <div class="add-row">
        <input id="new-icon" maxlength="4" value="🎒">
        <input id="new-name" placeholder="なまえ（れい：タオル）" maxlength="20">
        <button class="go" id="add-item">ついか</button>
      </div>
      <div class="emoji-pal" id="emoji-pal"></div>
    </div>

    <button class="reset-btn" id="reset-btn">🔄 チェックを ぜんぶ もどす</button>
  </div>

  <div class="celebrate" id="celebrate">
    <div class="c-card">
      <div class="c-emoji">🎉🧳🎉</div>
      <div class="c-title">じゅんび かんぺき！</div>
      <div class="c-sub" id="c-sub">わすれものは ないよ。いってらっしゃい！</div>
      <button class="c-ok" id="c-ok">やったー！</button>
    </div>
  </div>

<script>
  /* ════════════════════════════════════════════════════════
   *  じゅんび チェック
   *  ・「おとまり」「がっこう」などのリストを えらんで
   *    もちものを タップして ✅ にしていく
   *  ・ぜんぶ ✅ になると おいわい（＋ポイント）
   *  ・✏️ で へんしゅうモード：もちものの ついか・けす・ならびかえ、
   *    リストの ついか・なまえ変更・けす ができる（おうちの人向け）
   *  ・データは localStorage（この端末の中だけ）に保存
   * ════════════════════════════════════════════════════════ */
  const STORE_KEY = 'kids_junbi_v1';
  const REWARD_DEFAULT = 2;   // ぜんぶ できたときの ポイント（管理ツールで変更できる）

  // はじめて開いたときに入っている リスト
  const DEFAULT_SETS = [
    {
      id: 'otomari', icon: '🧳', name: 'おとまり',
      items: [
        ['👕', 'きがえの ふく'],
        ['🩲', 'したぎ'],
        ['🧦', 'くつした'],
        ['👘', 'パジャマ'],
        ['🪥', 'はブラシ'],
        ['🧴', 'タオル'],
        ['🧻', 'ハンカチ・ティッシュ'],
        ['🧢', 'ぼうし'],
        ['🥤', 'すいとう'],
        ['🍪', 'おやつ'],
        ['🧸', 'ぬいぐるみ'],
        ['💊', 'おくすり'],
        ['🛍️', 'ビニールぶくろ'],
        ['📖', 'ほん'],
      ],
    },
    {
      id: 'gakko', icon: '🎒', name: 'がっこう',
      items: [
        ['📚', 'きょうかしょ・ノート'],
        ['✏️', 'ふでばこ'],
        ['📒', 'れんらくちょう'],
        ['📄', 'しゅくだい'],
        ['🥤', 'すいとう'],
        ['🍱', 'きゅうしょくセット'],
        ['🧻', 'ハンカチ・ティッシュ'],
        ['👟', 'うわばき'],
        ['🎽', 'たいそうふく'],
        ['🧢', 'ぼうし'],
      ],
    },
  ];

  const EMOJI_PALETTE = ['🎒','👕','🩲','🧦','👘','🪥','🧴','🧻','🧢','🥤','🍪','🧸','💊','🛍️','📖','📚','✏️','📒','📄','🍱','👟','🎽','🩱','🕶️','☂️','🧥','🩴','📱','💰','🎫','🧼','🪮','🎨','🎵','⚽','🧩','🍎','🔑','🎁','⭐'];

  // ─── データの よみかき ──────────────────────────────
  let data = loadData();

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function makeDefault() {
    return {
      current: DEFAULT_SETS[0].id,
      sets: DEFAULT_SETS.map(s => ({
        id: s.id, icon: s.icon, name: s.name, rewarded: false,
        items: s.items.map(([icon, name]) => ({ id: uid(), icon, name, done: false })),
      })),
    };
  }

  function loadData() {
    try {
      const d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (d && Array.isArray(d.sets) && d.sets.length) return d;
    } catch (e) {}
    return makeDefault();
  }
  function save() { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }

  function currentSet() {
    return data.sets.find(s => s.id === data.current) || data.sets[0];
  }

  // ─── おと（ポン） ───────────────────────────────────
  let audioCtx = null;
  function beep(freq, dur, type) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }
  function soundCheck()   { beep(880, 0.12); setTimeout(() => beep(1320, 0.18), 80); }
  function soundUncheck() { beep(440, 0.12, 'triangle'); }
  function soundFanfare() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.3), i * 130)); }

  // ─── えがく ────────────────────────────────────────
  let editing = false;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function render() {
    const set = currentSet();
    data.current = set.id;

    // タブ
    const tabs = document.getElementById('tabs');
    tabs.innerHTML = data.sets.map(s => `
      <button class="tab ${s.id === set.id ? 'active' : ''}" data-id="${s.id}">
        <span class="t-icon">${esc(s.icon)}</span>${esc(s.name)}
      </button>`).join('') +
      (editing ? `<button class="tab add" id="add-set">＋ リスト</button>` : '');

    // すすみぐあい
    const total = set.items.length;
    const done = set.items.filter(i => i.done).length;
    const left = total - done;
    const pct = total ? Math.round(done / total * 100) : 0;
    const prog = document.getElementById('progress');
    prog.classList.toggle('done', total > 0 && left === 0);
    prog.innerHTML = `
      <div class="p-icon">${esc(set.icon)}</div>
      <div class="p-body">
        <div class="p-title">${esc(set.name)}の じゅんび</div>
        <div class="p-sub">${
          total === 0 ? 'もちものを ついかしてね' :
          left === 0  ? '✅ ぜんぶ できた！' :
                        `あと <b>${left}</b>こ（${done}／${total}）`
        }</div>
        <div class="bar"><i style="width:${pct}%"></i></div>
      </div>`;

    // リスト
    const list = document.getElementById('list');
    if (!total) {
      list.innerHTML = `<div class="empty">まだ もちものが ないよ<br>✏️ を おして ついかしてね</div>`;
    } else {
      list.innerHTML = set.items.map((it, idx) => `
        <div class="item ${it.done ? 'done' : ''}" data-id="${it.id}">
          <div class="i-icon">${esc(it.icon)}</div>
          <div class="i-name">${esc(it.name)}</div>
          <div class="i-check">${it.done ? '✓' : ''}</div>
          <div class="i-tools">
            <button class="tool-btn" data-act="up"   ${idx === 0 ? 'disabled' : ''}>▲</button>
            <button class="tool-btn" data-act="down" ${idx === total - 1 ? 'disabled' : ''}>▼</button>
            <button class="tool-btn del" data-act="del">✕</button>
          </div>
        </div>`).join('');
    }

    document.body.classList.toggle('editing', editing);
    document.getElementById('edit-btn').classList.toggle('on', editing);
    save();
  }

  // ─── さわったとき ───────────────────────────────────
  document.getElementById('tabs').addEventListener('click', e => {
    const t = e.target.closest('.tab');
    if (!t) return;
    if (t.id === 'add-set') { addSet(); return; }
    data.current = t.dataset.id;
    render();
  });

  document.getElementById('list').addEventListener('click', e => {
    const row = e.target.closest('.item');
    if (!row) return;
    const set = currentSet();
    const idx = set.items.findIndex(i => i.id === row.dataset.id);
    if (idx < 0) return;

    if (editing) {
      const act = e.target.closest('[data-act]')?.dataset.act;
      if (act === 'del') {
        if (confirm(`「${set.items[idx].name}」を けしますか？`)) set.items.splice(idx, 1);
      } else if (act === 'up' && idx > 0) {
        [set.items[idx - 1], set.items[idx]] = [set.items[idx], set.items[idx - 1]];
      } else if (act === 'down' && idx < set.items.length - 1) {
        [set.items[idx + 1], set.items[idx]] = [set.items[idx], set.items[idx + 1]];
      }
      render();
      return;
    }

    const it = set.items[idx];
    it.done = !it.done;
    it.done ? soundCheck() : soundUncheck();
    render();
    if (it.done && set.items.every(i => i.done)) celebrate(set);
  });

  // ぜんぶ できたときの おいわい
  function celebrate(set) {
    document.getElementById('c-sub').textContent =
      set.id === 'gakko' ? 'わすれものは ないよ。いってきます！' : 'わすれものは ないよ。いってらっしゃい！';
    document.getElementById('celebrate').classList.add('show');
    soundFanfare();
    confetti();
    // ポイントは 1かいの じゅんびにつき 1かいだけ
    if (!set.rewarded) {
      set.rewarded = true;
      save();
      if (typeof Points !== 'undefined' && typeof Points.rewardFor === 'function') {
        setTimeout(() => Points.rewardFor(REWARD_DEFAULT), 900);
      }
    }
  }
  document.getElementById('c-ok').addEventListener('click', () => {
    document.getElementById('celebrate').classList.remove('show');
  });

  function confetti() {
    const colors = ['#f97316', '#f59e0b', '#22c55e', '#3b82f6', '#ec4899', '#a855f7'];
    for (let i = 0; i < 60; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
      c.style.animationDelay = (Math.random() * 0.6) + 's';
      c.style.transform = `rotate(${Math.random() * 360}deg)`;
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4000);
    }
  }

  // リセット（つぎの おでかけ用に ぜんぶ もどす）
  document.getElementById('reset-btn').addEventListener('click', () => {
    const set = currentSet();
    if (!set.items.some(i => i.done)) return;
    if (!confirm(`「${set.name}」の チェックを ぜんぶ もどしますか？`)) return;
    set.items.forEach(i => i.done = false);
    set.rewarded = false;
    render();
  });

  // ─── へんしゅうモード ───────────────────────────────
  document.getElementById('edit-btn').addEventListener('click', () => {
    editing = !editing;
    render();
  });

  // えもじパレット
  const pal = document.getElementById('emoji-pal');
  pal.innerHTML = EMOJI_PALETTE.map(e => `<button type="button" data-e="${e}">${e}</button>`).join('');
  pal.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    document.getElementById('new-icon').value = b.dataset.e;
    pal.querySelectorAll('button').forEach(x => x.classList.toggle('sel', x === b));
  });

  function addItem() {
    const icon = document.getElementById('new-icon').value.trim() || '🎒';
    const nameEl = document.getElementById('new-name');
    const name = nameEl.value.trim();
    if (!name) { nameEl.focus(); return; }
    currentSet().items.push({ id: uid(), icon, name, done: false });
    currentSet().rewarded = false;
    nameEl.value = '';
    render();
    nameEl.focus();
  }
  document.getElementById('add-item').addEventListener('click', addItem);
  document.getElementById('new-name').addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });

  function addSet() {
    const name = prompt('あたらしい リストの なまえは？（れい：りょこう）');
    if (!name || !name.trim()) return;
    const icon = prompt('えもじを ひとつ えらんでね（れい：🏕️）', '📝') || '📝';
    const s = { id: uid(), icon: icon.trim() || '📝', name: name.trim(), rewarded: false, items: [] };
    data.sets.push(s);
    data.current = s.id;
    render();
  }

  document.getElementById('rename-set').addEventListener('click', () => {
    const set = currentSet();
    const name = prompt('リストの なまえ', set.name);
    if (name === null) return;
    const icon = prompt('えもじ', set.icon);
    if (name.trim()) set.name = name.trim();
    if (icon && icon.trim()) set.icon = icon.trim();
    render();
  });

  document.getElementById('delete-set').addEventListener('click', () => {
    const set = currentSet();
    if (data.sets.length <= 1) { alert('さいごの リストは けせないよ'); return; }
    if (!confirm(`「${set.name}」の リストを まるごと けしますか？`)) return;
    data.sets = data.sets.filter(s => s.id !== set.id);
    data.current = data.sets[0].id;
    render();
  });

  render();
</script>
</body>
</html>
