<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>おんどく れんしゅう</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Maru Gothic ProN', 'BIZ UDPGothic', 'MS PGothic', sans-serif;
      background: linear-gradient(135deg, #FFF0F8 0%, #F0F0FF 100%);
      min-height: 100dvh;
      color: #2d3748;
    }

    /* ─── ヘッダー ─────────────────────────── */
    .header {
      background: linear-gradient(135deg, #FF6B9D 0%, #A855F7 100%);
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 3px 12px rgba(255,107,157,0.35);
    }
    .back-btn {
      background: rgba(255,255,255,0.22);
      border: 1.5px solid rgba(255,255,255,0.4);
      color: white;
      font-size: 0.9rem;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
      flex-shrink: 0;
    }
    .back-btn:active { opacity: 0.7; }
    .header h1 { font-size: 1.25rem; font-weight: 900; }

    /* ─── ストーリーリスト ───────────────────── */
    #screen-list { padding: 20px 16px 40px; }

    .add-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 16px;
      background: white;
      border: 2.5px dashed #FF6B9D;
      border-radius: 16px;
      color: #FF6B9D;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      margin-bottom: 20px;
      font-family: inherit;
      transition: background 0.15s;
    }
    .add-btn:active { background: #FFF0F8; }

    .story-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .story-card {
      background: white;
      border-radius: 20px;
      padding: 20px 14px 16px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      transition: transform 0.13s, box-shadow 0.13s;
      position: relative;
      border-top: 5px solid var(--c, #FF6B9D);
    }
    .story-card:active { transform: scale(0.97); }

    .story-emoji { font-size: 2.8rem; display: block; margin-bottom: 10px; }
    .story-title { font-size: 0.93rem; font-weight: 800; line-height: 1.4; }
    .story-lines { font-size: 0.72rem; color: #a0aec0; margin-top: 4px; }

    /* 削除ボタン（ホバー・タップで表示） */
    .del-btn {
      position: absolute;
      top: 8px; right: 8px;
      background: #FFE4E4;
      border: none;
      border-radius: 50%;
      width: 26px; height: 26px;
      font-size: 0.8rem;
      cursor: pointer;
      color: #E53E3E;
      opacity: 0;
      transition: opacity 0.2s;
      font-family: inherit;
    }
    .story-card:hover .del-btn,
    .story-card:focus-within .del-btn { opacity: 1; }

    .empty-msg {
      text-align: center;
      padding: 48px 24px;
      color: #a0aec0;
      font-size: 0.95rem;
      line-height: 2;
    }
    .empty-msg .e { font-size: 3rem; display: block; margin-bottom: 12px; }

    /* ─── よみがき画面 ─────────────────────── */
    #screen-read {
      display: none;
      flex-direction: column;
      min-height: 100dvh;
    }

    .progress-wrap { background: #e2e8f0; height: 7px; }
    .progress-bar {
      background: linear-gradient(90deg, #FF6B9D, #A855F7);
      height: 100%;
      transition: width 0.4s ease;
    }

    .read-body {
      flex: 1;
      padding: 28px 22px 100px;
      overflow-y: auto;
      line-height: 2.4;
      font-size: 1.65rem;
      font-weight: 700;
    }

    /* 文ごとの span */
    .sen {
      display: inline;
      border-radius: 6px;
      padding: 2px 2px;
      transition: background 0.25s, color 0.25s;
    }
    .sen.current {
      background: #FFF3B0;
      box-shadow: 0 0 0 2px #FFD700;
      border-radius: 4px;
    }
    .sen.done { color: #cbd5e0; }

    .read-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: white;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
      z-index: 10;
    }
    .counter-badge {
      background: #f7fafc;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.85rem;
      color: #718096;
      white-space: nowrap;
    }
    .next-btn {
      flex: 1;
      background: linear-gradient(135deg, #FF6B9D, #A855F7);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s;
    }
    .next-btn:active { opacity: 0.82; }

    /* ─── かんりょう画面 ───────────────────── */
    #screen-done {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80dvh;
      padding: 40px 24px;
      text-align: center;
    }
    .done-star { font-size: 5rem; margin-bottom: 16px; animation: pop 0.4s ease; }
    @keyframes pop {
      0%   { transform: scale(0.4); }
      70%  { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    .done-title {
      font-size: 2rem;
      font-weight: 900;
      color: #FF6B9D;
      margin-bottom: 6px;
    }
    .done-sub { font-size: 1rem; color: #718096; margin-bottom: 32px; }
    .done-back {
      background: linear-gradient(135deg, #FF6B9D, #A855F7);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 16px 36px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      font-family: inherit;
    }

    /* ─── モーダル（おはなし追加） ─────────── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200;
      align-items: flex-end;
    }
    .overlay.open { display: flex; }

    .modal {
      background: white;
      border-radius: 24px 24px 0 0;
      padding: 28px 20px 40px;
      width: 100%;
      max-height: 88dvh;
      overflow-y: auto;
    }
    .modal-title { font-size: 1.15rem; font-weight: 900; color: #FF6B9D; margin-bottom: 20px; }
    .field-label {
      font-size: 0.82rem;
      font-weight: 700;
      color: #718096;
      display: block;
      margin-bottom: 6px;
    }
    .field-input, .field-textarea {
      width: 100%;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 1rem;
      font-family: inherit;
      margin-bottom: 18px;
      outline: none;
      transition: border-color 0.2s;
    }
    .field-input:focus, .field-textarea:focus { border-color: #FF6B9D; }
    .field-textarea { min-height: 200px; line-height: 2; resize: vertical; }
    .field-hint { font-size: 0.76rem; color: #a0aec0; margin-top: -14px; margin-bottom: 18px; }

    .emoji-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .e-btn {
      width: 44px; height: 44px;
      font-size: 1.5rem;
      border: 2.5px solid #e2e8f0;
      border-radius: 10px;
      cursor: pointer;
      background: white;
      transition: border-color 0.15s, background 0.15s;
    }
    .e-btn.sel { border-color: #FF6B9D; background: #FFF0F8; }

    .save-btn {
      width: 100%;
      background: linear-gradient(135deg, #FF6B9D, #A855F7);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      font-family: inherit;
    }
    .save-btn:active { opacity: 0.85; }
  </style>
  <!-- ポイント共通ライブラリ（各アプリで共通のポイント/記録機能） -->
  <script src="../../shared/points.js"></script>
</head>
<body>

<!-- ヘッダー（全画面共通） -->
<div class="header">
  <button class="back-btn" id="header-back" onclick="handleBack()">‹ もどる</button>
  <h1>📖 おんどく れんしゅう</h1>
</div>

<!-- ① ストーリーリスト画面 -->
<div id="screen-list">
  <div style="padding: 20px 16px 0">
    <button class="add-btn" onclick="openModal()">＋ おはなしを ついかする</button>
  </div>
  <div id="story-grid" style="padding: 0 16px"></div>
  <div id="empty-msg" class="empty-msg" style="display:none">
    <span class="e">📚</span>
    おはなしが まだ ありません。<br>
    「＋ おはなしを ついかする」を<br>
    おしてください。
  </div>
</div>

<!-- ② よみがき画面 -->
<div id="screen-read">
  <div class="progress-wrap"><div class="progress-bar" id="prog-bar" style="width:0%"></div></div>
  <div class="read-body" id="read-body"></div>
  <div class="read-footer">
    <div class="counter-badge" id="counter">1 / 1</div>
    <button class="next-btn" id="next-btn" onclick="nextSentence()">つぎへ →</button>
  </div>
</div>

<!-- ③ かんりょう画面 -->
<div id="screen-done">
  <div class="done-star"  id="done-star">🌟</div>
  <div class="done-title" id="done-title">よく できました！</div>
  <div class="done-sub"   id="done-sub">おんどく かんりょう！ すごいね！</div>
  <button class="done-back" onclick="showScreen('list')">もどる</button>
</div>

<!-- おはなし追加モーダル -->
<div class="overlay" id="overlay" onclick="overlayClose(event)">
  <div class="modal">
    <div class="modal-title">📝 おはなしを ついかする</div>

    <label class="field-label">タイトル</label>
    <input class="field-input" id="inp-title" type="text" placeholder="れい：おおきな かぶ">

    <label class="field-label">えもじ</label>
    <div class="emoji-row" id="emoji-row"></div>

    <label class="field-label">ぶんしょう</label>
    <textarea class="field-textarea" id="inp-text"
      placeholder="ここに ぶんしょうを うちこんでください。&#10;&#10;Enterキー（かいぎょう）で くぎると&#10;1ぎょうずつ よめます。"></textarea>
    <div class="field-hint">※ Enterで かいぎょうすると 1ぶんずつ よめます</div>

    <button class="save-btn" onclick="saveStory()">ほぞんする ✓</button>
  </div>
</div>

      title: 'まどから きた おばけ',
      emoji: '👻',
      text: 'よる、つよい かぜが ビュー。\nちいさな おばけが、かぜに とばされて きました。\nふわり、まどから なかに はいって きました。\n「やっと とまれた。」\nおばけは、ほっと ひといき。\nあきこちゃんは、びっくり。\n「さむかったでしょう。ココアを のもう。」\nふたりで、あたたかい ココアを のみました。\nぽかぽか、あったかい。\n「つかれたの？ ベッドで ねていいよ。」\nふわふわの ベッドに、おばけは もぐりこみました。\n「ふわふわで、きもちいい。」\nすぐに、すやすや ねむって しまいました。\nあさ、あきこちゃんが おきると、おばけは いません。\nそとを みると、こうえんの ブランコで あそんで いました。\nギイ、ギイ、たのしそう。\n「まってー！」\nあきこちゃんも、こうえんへ かけて いきました。\nふたりで ブランコ、きらきら わらいました。'
    }
  ];

  /** 初期化：localStorage からストーリーを読み込む */
  function init() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      try { stories = JSON.parse(raw); } catch { stories = []; }
    }
    // プリセットのおはなしを最新の内容に合わせる。
    // ・まだ無ければ追加する（新しい端末・削除後も自動で復元）
    // ・すでにある場合は中身を上書きする（文章を直したとき、使用中の端末でも
    //   開き直せば新しい文が反映される）。
    //   ※利用者がアプリ内で「＋」から追加したおはなし（id が story_... のもの）は
    //     プリセットに無いので、上書き・削除されず そのまま残る。
    let changed = false;
    PRESET_STORIES.forEach(preset => {
      const existing = stories.find(s => s.id === preset.id);
      if (existing) {
        if (existing.title !== preset.title ||
            existing.emoji !== preset.emoji ||
            existing.text  !== preset.text) {
          existing.title = preset.title;
          existing.emoji = preset.emoji;
          existing.text  = preset.text;
          changed = true;
        }
      } else {
        stories.push(preset);
        changed = true;
      }
    });
    if (changed) save();
    renderEmojis();
    renderList();
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(stories));
  }

  // ======================================================
  // ストーリーリスト
  // ======================================================
  function renderList() {
    const grid = document.getElementById('story-grid');
    const empty = document.getElementById('empty-msg');

    if (stories.length === 0) {
      grid.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    grid.innerHTML = `<div class="story-grid">${
      stories.map((s, i) => {
        const lines = s.text.split('\n').filter(l => l.trim()).length;
        const color = CARD_COLORS[i % CARD_COLORS.length];
        return `<div class="story-card" style="--c:${color}" onclick="openStory(${i})">
          <button class="del-btn" onclick="delStory(event,${i})">✕</button>
          <span class="story-emoji">${esc(s.emoji)}</span>
          <div class="story-title">${esc(s.title)}</div>
          <div class="story-lines">${lines}ぶん</div>
        </div>`;
      }).join('')
    }</div>`;
  }

  // ======================================================
  // よみがき画面
  // ======================================================
  function openStory(idx) {
    const story = stories[idx];
    // 改行で文を分割
    sentences = story.text
      .split('\n')
      .map(l => l.trim())
      .filter(l => l.length > 0);
    if (sentences.length === 0) return;

    curIdx = 0;
    rushedCount = 0;   // はやよみカウントをリセット

    // 全文を span で描画
    document.getElementById('read-body').innerHTML =
      sentences.map((s, i) =>
        `<span class="sen ${i === 0 ? 'current' : ''}" id="s${i}">${esc(s)}</span>`
      ).join('<wbr> ');  // wbr で自然な折り返し

    updateReadUI();
    showScreen('read');
    scrollToCur();
    sentenceShownAt = Date.now();   // さいしょの文を見せた時刻をおぼえる
  }

  function updateReadUI() {
    const total = sentences.length;
    document.getElementById('prog-bar').style.width = ((curIdx + 1) / total * 100) + '%';
    document.getElementById('counter').textContent = `${curIdx + 1} / ${total}`;
    document.getElementById('next-btn').textContent =
      curIdx >= total - 1 ? '✅ かんりょう！' : 'つぎへ →';
  }

  function nextSentence() {
    const total = sentences.length;

    // いま読んでいた文に かけた時間をみる。
    // 文の長さ（文字数）にくらべて はやすぎるときは「よみとばし」として数える。
    // ・minGap … その文を読むのに さいていこれくらいはかかる、という目安
    // ・放置してから最後だけ連打…にも強いよう、文ごとに1つずつ判定する
    const gap = Date.now() - sentenceShownAt;
    const minGap = Math.max(600, sentences[curIdx].length * READ_MS_PER_CHAR);
    if (gap < minGap) rushedCount++;

    if (curIdx >= total - 1) {
      // さいごまで来た。ちゃんと よんだ ときだけ ごほうびを出す。
      // 文の 4わり より多くを よみとばして いたら「はやよみ（連打）」とみなして加点しない。
      const readProperly = (rushedCount / total) <= 0.4;
      if (readProperly) {
        // もらえる数は管理ツールの「ポイント設定」で変えられる（初期値3）
        Points.rewardFor(3);
        setDoneScreen(true);
      } else {
        setDoneScreen(false);
      }
      showScreen('done');
      return;
    }
    document.getElementById(`s${curIdx}`).className = 'sen done';
    curIdx++;
    document.getElementById(`s${curIdx}`).className = 'sen current';
    sentenceShownAt = Date.now();   // つぎの文を見せた時刻をおぼえる
    updateReadUI();
    scrollToCur();
  }

  /**
   * かんりょう画面の文言を セットする。
   * @param {boolean} rewarded ちゃんと読めて ポイントをあげたか
   */
  function setDoneScreen(rewarded) {
    if (rewarded) {
      document.getElementById('done-star').textContent  = '🌟';
      document.getElementById('done-title').textContent = 'よく できました！';
      document.getElementById('done-sub').textContent   = 'おんどく かんりょう！ すごいね！';
    } else {
      // はやよみ（連打）のとき：しからず、やさしく さそう。ポイントは無し。
      document.getElementById('done-star').textContent  = '🐢';
      document.getElementById('done-title').textContent = 'ゆっくり よもう';
      document.getElementById('done-sub').textContent   = 'こえに だして よむと ⭐ポイントが もらえるよ';
    }
  }

  function scrollToCur() {
    const el = document.getElementById(`s${curIdx}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // ======================================================
  // 画面切り替え
  // ======================================================
  function showScreen(name) {
    document.getElementById('screen-list').style.display = name === 'list' ? 'block' : 'none';
    const readEl = document.getElementById('screen-read');
    readEl.style.display = name === 'read' ? 'flex' : 'none';
    if (name === 'read') readEl.style.flexDirection = 'column';
    const doneEl = document.getElementById('screen-done');
    doneEl.style.display = name === 'done' ? 'flex' : 'none';
    if (name === 'done') doneEl.style.flexDirection = 'column';
  }

  /** ヘッダーの「もどる」ボタン：読み中はリストへ、リストはランチャーへ */
  function handleBack() {
    const readVisible = document.getElementById('screen-read').style.display === 'flex';
    const doneVisible = document.getElementById('screen-done').style.display === 'flex';
    if (readVisible || doneVisible) {
      showScreen('list');
    } else {
      location.href = '../../index.html';
    }
  }

  // ======================================================
  // おはなし追加モーダル
  // ======================================================
  function openModal() {
    document.getElementById('inp-title').value = '';
    document.getElementById('inp-text').value = '';
    selEmoji = EMOJIS[0];
    renderEmojis();
    document.getElementById('overlay').classList.add('open');
  }

  function overlayClose(e) {
    if (e.target === document.getElementById('overlay'))
      document.getElementById('overlay').classList.remove('open');
  }

  function renderEmojis() {
    document.getElementById('emoji-row').innerHTML = EMOJIS.map(e =>
      `<button class="e-btn ${e === selEmoji ? 'sel' : ''}" onclick="pickEmoji('${e}')">${e}</button>`
    ).join('');
  }

  function pickEmoji(e) {
    selEmoji = e;
    renderEmojis();
  }

  function saveStory() {
    const title = document.getElementById('inp-title').value.trim();
    const text  = document.getElementById('inp-text').value.trim();
    if (!title || !text) {
      alert('タイトルと ぶんしょうを にゅうりょくしてください');
      return;
    }
    stories.push({ id: 'story_' + Date.now(), title, emoji: selEmoji, text });
    save();
    renderList();
    document.getElementById('overlay').classList.remove('open');
  }

  function delStory(e, idx) {
    e.stopPropagation();
    if (!confirm('このおはなしを けしますか？')) return;
    stories.splice(idx, 1);
    save();
    renderList();
  }

  /** XSS 対策：HTML 特殊文字をエスケープ */
  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  init();
</script>
</body>
</html>
