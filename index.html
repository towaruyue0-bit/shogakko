<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>小学校 学習アプリ</title>
  <style>
    /* ─── 全体リセット ─────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Maru Gothic ProN', 'BIZ UDPGothic', 'MS PGothic', sans-serif;
      background: linear-gradient(135deg, #e0f0ff 0%, #fce4ff 100%);
      min-height: 100dvh;
      padding-bottom: 32px;
    }

    /* ─── ヘッダー ─────────────────────────────────────── */
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
      padding: 28px 16px 20px;
      position: relative;
      box-shadow: 0 4px 16px rgba(102,126,234,0.4);
    }
    .header-icon { font-size: 2.6rem; display: block; margin-bottom: 4px; }
    .header h1  { font-size: 1.55rem; font-weight: 900; letter-spacing: 0.05em; }
    .header p   { font-size: 0.88rem; opacity: 0.88; margin-top: 4px; }

    /* 管理ツールへのリンク（右上の小さいボタン） */
    .manage-btn {
      position: absolute;
      top: 14px;
      background: rgba(255,255,255,0.22);
      color: white;
      border: 1.5px solid rgba(255,255,255,0.4);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 0.72rem;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .manage-btn:hover { background: rgba(255,255,255,0.35); }

    /* ─── いまのポイント（タップで どうがタイマーへ） ───────── */
    .points-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      background: rgba(255,255,255,0.92);
      color: #7c5cff;
      font-weight: 900;
      font-size: 1rem;
      text-decoration: none;
      border-radius: 999px;
      padding: 8px 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.18);
      transition: transform 0.12s;
    }
    .points-pill:hover { transform: translateY(-2px); }
    .points-pill:active { transform: scale(0.96); }
    .points-pill .pts-num { font-size: 1.25rem; }

    /* ─── なつやすみの しゅくだい パネル（2026年 夏限定） ────── */
    .shw-panel {
      margin: 18px 14px 0;
      background: white;
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.10);
      overflow: hidden;
      border: 2.5px solid #7cc7ff;
    }
    .shw-head {
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      color: white;
      font-weight: 900;
      font-size: 0.92rem;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .shw-head .shw-progress {
      margin-left: auto;
      font-size: 0.74rem;
      background: rgba(255,255,255,0.25);
      border-radius: 999px;
      padding: 3px 10px;
      white-space: nowrap;
    }
    .shw-head .shw-arrow { font-size: 0.8rem; }
    /* しめきりごとの小見出し（8/24まで・8/31まで など） */
    .shw-group {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px 7px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 0.8rem;
      font-weight: 900;
      border-bottom: 1.5px solid #dbeafe;
    }
    .shw-group .shw-days {
      margin-left: auto;
      font-size: 0.74rem;
      color: #dc2626;
      background: #fee2e2;
      border-radius: 999px;
      padding: 3px 10px;
    }
    .shw-group .shw-days.ok { color: #276749; background: #e6f9ee; }
    .shw-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-bottom: 1.5px solid #e8f2ff;
      cursor: pointer;
      transition: background 0.15s;
      user-select: none;
    }
    .shw-item:active, .shw-item:hover { background: #f0f9ff; }
    .shw-item.done { opacity: 0.62; background: #f7fdf9; }
    .shw-check { font-size: 1.5rem; flex-shrink: 0; width: 1.7rem; text-align: center; }
    .shw-info { flex: 1; min-width: 0; }
    .shw-name { font-weight: 800; font-size: 0.92rem; color: #2d3748; }
    .shw-item.done .shw-name { text-decoration: line-through; }
    .shw-note { font-size: 0.78rem; color: #64748b; font-weight: 700; margin-top: 2px; }
    /* チップの無い宿題だけ 行ぜんたいがタップできる */
    .shw-item.has-subs { cursor: default; }
    .shw-item.has-subs:active, .shw-item.has-subs:hover { background: inherit; }
    /* 「3/21」のような小さな進みぐあい表示 */
    .shw-mini {
      margin-left: 8px;
      font-size: 0.72rem;
      font-weight: 900;
      color: #6366f1;
      background: #eef2ff;
      border-radius: 999px;
      padding: 2px 8px;
      vertical-align: middle;
    }
    /* 小さなチップ（ドリルのページ番号・えにっき1まいめ など） */
    .shw-subrow { display: flex; align-items: flex-start; gap: 8px; margin-top: 7px; }
    .shw-sublabel {
      font-size: 0.72rem; font-weight: 900; color: #475569;
      flex-shrink: 0; width: 4.2em; padding-top: 5px;
    }
    .shw-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .shw-chip {
      font-size: 0.8rem; font-weight: 800;
      border-radius: 9px; padding: 5px 9px; min-width: 2.1em; text-align: center;
      background: #eef2f7; color: #64748b; border: 1.5px solid #dbe3ee;
      cursor: pointer; transition: transform 0.1s, background 0.15s;
      user-select: none;
    }
    .shw-chip:active { transform: scale(0.92); }
    .shw-chip.done { background: #d1fae5; color: #276749; border-color: #7fdcae; }
    .shw-chip.done::before { content: '✓'; margin-right: 3px; }
    .shw-alldone {
      text-align: center;
      padding: 12px 14px;
      font-weight: 900;
      color: #276749;
      background: #f0fff4;
      font-size: 0.95rem;
    }
    .shw-footnote {
      padding: 9px 14px;
      font-size: 0.74rem;
      color: #92400e;
      background: #fffbeb;
      font-weight: 700;
      line-height: 1.6;
    }

    /* ─── きょうの しゅくだい パネル ─────────────────────── */
    .hw-panel {
      margin: 18px 14px 0;
      background: white;
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.10);
      overflow: hidden;
      border: 2.5px solid #ffb35c;
    }
    .hw-panel-head {
      background: linear-gradient(135deg, #ff9a3c, #ff6b6b);
      color: white;
      font-weight: 900;
      font-size: 1rem;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hw-panel-head .hw-progress {
      margin-left: auto;
      font-size: 0.82rem;
      background: rgba(255,255,255,0.25);
      border-radius: 999px;
      padding: 4px 12px;
    }
    .hw-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      text-decoration: none;
      color: inherit;
      border-bottom: 1.5px solid #ffeeda;
      transition: background 0.15s;
    }
    .hw-item:last-child { border-bottom: none; }
    .hw-item:active, .hw-item:hover { background: #fff7ec; }
    .hw-item.done { opacity: 0.62; background: #f7fdf9; }
    .hw-item-icon { font-size: 1.9rem; flex-shrink: 0; }
    .hw-item-info { flex: 1; min-width: 0; }
    .hw-item-name { font-weight: 800; font-size: 0.92rem; color: #2d3748; }
    .hw-item-note { font-size: 0.8rem; color: #b45309; font-weight: 700; margin-top: 2px; }
    .hw-item.done .hw-item-name { text-decoration: line-through; }
    .hw-badge {
      flex-shrink: 0;
      font-size: 0.78rem;
      font-weight: 900;
      border-radius: 999px;
      padding: 6px 12px;
    }
    .hw-badge.todo { background: #fff1e0; color: #dd6b20; }
    .hw-badge.done { background: #e6f9ee; color: #276749; }
    .hw-alldone {
      text-align: center;
      padding: 12px 14px;
      font-weight: 900;
      color: #276749;
      background: #f0fff4;
      font-size: 0.95rem;
    }

    /* ─── カテゴリ見出し ────────────────────────────────── */
    .category-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: #6b7a99;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 24px 16px 8px;
    }

    /* ─── アプリグリッド ────────────────────────────────── */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 0 14px;
    }
    @media (min-width: 480px) {
      .app-grid { grid-template-columns: repeat(3, 1fr); }
    }

    /* ─── アプリカード ──────────────────────────────────── */
    .app-card {
      background: white;
      border-radius: 20px;
      padding: 20px 12px 16px;
      text-align: center;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
      display: block;
      position: relative;
      overflow: hidden;
    }
    .app-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: var(--card-color, #667eea);
      border-radius: 20px 20px 0 0;
    }
    .app-card:active,
    .app-card:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 10px 28px rgba(0,0,0,0.14);
    }

    .app-icon {
      font-size: 2.8rem;
      display: block;
      margin-bottom: 8px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.12));
    }
    .app-name {
      font-size: 0.92rem;
      font-weight: 800;
      color: #2d3748;
      line-height: 1.3;
      margin-bottom: 4px;
    }
    .app-desc {
      font-size: 0.72rem;
      color: #718096;
      line-height: 1.4;
    }

    /* ─── 空メッセージ ──────────────────────────────────── */
    .empty-msg {
      text-align: center;
      padding: 48px 24px;
      color: #a0aec0;
      font-size: 0.95rem;
      line-height: 1.8;
    }
    .empty-msg span { font-size: 2.5rem; display: block; margin-bottom: 12px; }

    /* ─── フッター ──────────────────────────────────────── */
    .footer {
      text-align: center;
      margin-top: 28px;
      font-size: 0.7rem;
      color: #a0aec0;
    }

    /* ─── ローディング ──────────────────────────────────── */
    #loading {
      text-align: center;
      padding: 48px;
      font-size: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="header">
    <a class="manage-btn" href="kiroku.html" style="left:14px">📊 きろく</a>
    <a class="manage-btn" href="manage.html" style="right:14px">⚙ 管理</a>
    <span class="header-icon">📚</span>
    <h1 id="site-title">小学校 学習アプリ</h1>
    <p id="site-subtitle">いっしょにべんきょうしよう！</p>
    <a class="points-pill" href="apps/timer/">⭐ <span class="pts-num" id="pts-num">0</span> ポイント</a>
  </div>

  <div id="loading">⏳</div>
  <div id="summer-hw-panel"></div>
  <div id="homework-panel"></div>
  <div id="app-container" style="display:none"></div>

  <div class="footer">
    <p id="footer-text"></p>
  </div>

  <!-- ポイント共通ライブラリ -->
  <script src="shared/points.js"></script>
  <script>
    /**
     * apps.json を読み込んで、アプリ一覧をカードとして表示する。
     * カテゴリごとにグループ分けして表示する。
     */
    async function loadApps() {
      const loading = document.getElementById('loading');
      const container = document.getElementById('app-container');

      try {
        // apps.json を取得（サーバー経由で動作）
        const res = await fetch('apps.json?t=' + Date.now());
        const data = await res.json();

        // ヘッダーのタイトルを設定
        if (data.title)    document.getElementById('site-title').textContent    = data.title;
        if (data.subtitle) document.getElementById('site-subtitle').textContent = data.subtitle;
        document.title = data.title || '小学校 学習アプリ';

        // 表示対象のアプリだけ取り出す
        const apps = (data.apps || []).filter(a => a.visible !== false);

        if (apps.length === 0) {
          container.innerHTML = `
            <div class="empty-msg">
              <span>🎒</span>
              アプリがまだありません。<br>
              「⚙ 管理」から追加してください。
            </div>`;
          loading.style.display = 'none';
          container.style.display = 'block';
          return;
        }

        // カテゴリごとにグループ化
        const categories = {};
        apps.forEach(app => {
          const cat = app.category || 'その他';
          if (!categories[cat]) categories[cat] = [];
          categories[cat].push(app);
        });

        // カテゴリごとにカードを生成
        let html = '';
        Object.entries(categories).forEach(([catName, catApps]) => {
          html += `<div class="category-label">${catName}</div>`;
          html += `<div class="app-grid">`;
          catApps.forEach(app => {
            html += `
              <a class="app-card" href="${escHtml(app.url)}"
                 style="--card-color: ${escHtml(app.color || '#667eea')}">
                <span class="app-icon">${escHtml(app.icon || '📖')}</span>
                <div class="app-name">${escHtml(app.name)}</div>
                <div class="app-desc">${escHtml(app.description || '')}</div>
              </a>`;
          });
          html += `</div>`;
        });

        container.innerHTML = html;

        // きょうの しゅくだいパネルを表示する
        renderHomeworkPanel(apps);

      } catch (err) {
        // ファイルとして直接開いた場合はフォールバックメッセージを表示
        container.innerHTML = `
          <div class="empty-msg">
            <span>⚠️</span>
            サーバーを起動してから開いてください。<br>
            <small>「サーバー起動.bat」をダブルクリックして<br>表示されたURLにアクセスしてください。</small>
          </div>`;
      }

      loading.style.display = 'none';
      container.style.display = 'block';
    }

    /**
     * きょうの しゅくだいパネルを描画する。
     * 管理ツールで設定した「きょうの日付」のしゅくだいだけを表示する。
     * しゅくだいが無い日は なにも表示しない。
     * @param {Array} apps apps.json のアプリ一覧（名前やアイコンを引くのに使う）
     */
    function renderHomeworkPanel(apps) {
      const panel = document.getElementById('homework-panel');
      const hw = (typeof Homework !== 'undefined') ? Homework.getToday() : null;
      if (!hw) { panel.innerHTML = ''; return; }

      const doneCount = hw.items.filter(it => it.done).length;
      const allDone = doneCount === hw.items.length;

      // しゅくだいの1行ぶんを作る（アプリ情報が見つからないIDはとばす）
      let rows = '';
      hw.items.forEach(it => {
        const app = apps.find(a => a.id === it.appId);
        if (!app) return;
        rows += `
          <a class="hw-item ${it.done ? 'done' : ''}" href="${escHtml(app.url)}">
            <span class="hw-item-icon">${escHtml(app.icon || '📖')}</span>
            <div class="hw-item-info">
              <div class="hw-item-name">${escHtml(app.name)}</div>
              ${it.note ? `<div class="hw-item-note">${escHtml(it.note)}</div>` : ''}
            </div>
            <span class="hw-badge ${it.done ? 'done' : 'todo'}">
              ${it.done ? '✅ できた！' : 'やる！'}
            </span>
          </a>`;
      });
      if (!rows) { panel.innerHTML = ''; return; }

      panel.innerHTML = `
        <div class="hw-panel">
          <div class="hw-panel-head">
            📌 きょうの しゅくだい
            <span class="hw-progress">${doneCount} / ${hw.items.length} できた</span>
          </div>
          ${rows}
          ${allDone ? '<div class="hw-alldone">🏆 ぜんぶ おわったよ！すごい！！</div>' : ''}
        </div>`;
    }

    /* ════════════════════════════════════════════════════════
     *  なつやすみの しゅくだい（2026年 夏限定の TODO リスト）
     *  ・学校からもらった宿題プリントの内容を そのまま一覧にしたもの
     *  ・行をタップすると ✅（もう一度タップで もどる）
     *  ・チェックは localStorage に保存される（この端末の中だけ）
     *  ・9/7 以降（あさがお持参期間が終わったら）は自動で表示しない
     * ════════════════════════════════════════════════════════ */
    const SUMMER_HW_KEY = 'kids_summer_hw_2026';

    /** 「1」〜「n」の数字チップを作るヘルパー（ドリルのページ番号など用）。 */
    function summerChips(prefix, n) {
      const arr = [];
      for (let i = 1; i <= n; i++) arr.push({ id: `${prefix}${i}`, label: String(i) });
      return arr;
    }

    // しめきりグループごとの宿題一覧（1年2組の夏休みプリントより）
    // subs があるものは 小さなチップを1つずつタップしてすすめる。
    // チップが全部おわると その宿題が自動で ✅ になる。
    const SUMMER_HW_GROUPS = [
      {
        label: '📮 8/24（げつ）までに だすもの',
        deadline: '2026-08-24',
        items: [
          { id: 'drill', name: 'なつどりる', note: 'まるつけ・なおしまで やる',
            subs: [
              { label: 'さんすう',  chips: summerChips('drill_s', 10) },
              { label: 'こくご',    chips: summerChips('drill_k', 9) },
              { label: 'せいかつ',  chips: summerChips('drill_se', 2) },
            ] },
          { id: 'enikki', name: 'おもいで えにっき', note: '2まい かく',
            subs: [
              { label: '', chips: [
                { id: 'enikki_1', label: '1まいめ' },
                { id: 'enikki_2', label: '2まいめ' },
              ] },
            ] },
          { id: 'asagao', name: 'あさがおの かんさつ', note: 'みつけたよカード 2まい',
            subs: [
              { label: '', chips: [
                { id: 'asagao_1', label: '1まいめ' },
                { id: 'asagao_2', label: '2まいめ' },
              ] },
            ] },
          { id: 'kansobun', name: 'どくしょかんそうぶん', note: '800じまで',
            subs: [
              { label: '', chips: [
                { id: 'kansobun_yomu',     label: '①ほんを よむ' },
                { id: 'kansobun_sitagaki', label: '②したがき' },
                { id: 'kansobun_siage',    label: '③しあげ' },
              ] },
            ] },
          { id: 'oubo', name: 'じゆうおうぼ：タイタニックごう ちょきんばこ', note: 'たて・よこ・たかさ 25cm いない で つくろう',
            subs: [
              { label: '', chips: [
                { id: 'oubo_design',   label: '①デザインを かんがえる' },
                { id: 'oubo_zairyo',   label: '②ざいりょう あつめ' },
                { id: 'oubo_kumitate', label: '③くみたて' },
                { id: 'oubo_ironuri',  label: '④いろぬり・かざり' },
                { id: 'oubo_check',    label: '⑤しあげチェック' },
              ] },
            ] },
        ],
      },
      {
        label: '📮 8/31（げつ）までに だすもの',
        deadline: '2026-08-31',
        items: [
          { id: 'seikatsu', name: 'せいかつひょう',      note: 'まいにち ◎○△を つける（さいごまで かけたら ✅）' },
          { id: 'hamigaki', name: 'はみがき かれんだあ', note: 'まいにち しるしを つける（ぜんぶ うまったら ✅）' },
          { id: 'marathon', name: 'どくしょまらそん', note: 'ほんを 10さつ いじょう よむ',
            subs: [
              { label: 'よんだ ほん', chips: summerChips('marathon_', 10) },
            ] },
        ],
      },
      {
        label: '✏️ そのほか',
        deadline: null,
        items: [
          { id: 'jishu', name: 'じしゅがくしゅう', note: 'すきな べんきょうを やってみよう' },
        ],
      },
    ];

    /** その宿題が「できた」かどうか。subs があるものは チップ全部で できた。 */
    function summerItemDone(it, state) {
      if (it.subs) return it.subs.every(sg => sg.chips.every(c => state[c.id]));
      return !!state[it.id];
    }

    /** チェック状態を読みこむ（無ければ空っぽ）。 */
    function readSummerHw() {
      try { return JSON.parse(localStorage.getItem(SUMMER_HW_KEY) || '{}'); }
      catch (e) { return {}; }
    }

    /** きょうの日付を「2026-07-18」の形で返す。 */
    function summerTodayStr() {
      const d = new Date();
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    }

    /** しめきりまでの のこり日数を返す（きょうを含めない）。 */
    function daysUntil(dateStr) {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      return Math.round((new Date(dateStr + 'T00:00:00') - today) / 86400000);
    }

    /** なつやすみの しゅくだいパネルを描画する。 */
    function renderSummerHwPanel() {
      const panel = document.getElementById('summer-hw-panel');
      // 夏休みが終わったら（9/7以降）は表示しない
      if (summerTodayStr() > '2026-09-06') { panel.innerHTML = ''; return; }

      const state = readSummerHw();
      const allItems = SUMMER_HW_GROUPS.flatMap(g => g.items);
      const doneCount = allItems.filter(it => summerItemDone(it, state)).length;
      const allDone = doneCount === allItems.length;
      // ふだんは たたんだ状態で表示する（開いた状態は _collapsed === false のときだけ）
      const collapsed = state._collapsed !== false;

      // しめきりグループごとに行を作る
      let body = '';
      if (!collapsed) {
        SUMMER_HW_GROUPS.forEach(g => {
          // のこり日数バッジ（しめきりが無いグループには出さない）
          let daysHtml = '';
          if (g.deadline) {
            const left = daysUntil(g.deadline);
            const groupDone = g.items.every(it => summerItemDone(it, state));
            if (groupDone)       daysHtml = `<span class="shw-days ok">✅ ぜんぶ できた</span>`;
            else if (left > 1)   daysHtml = `<span class="shw-days">あと ${left}にち</span>`;
            else if (left === 1) daysHtml = `<span class="shw-days">あした まで！</span>`;
            else if (left === 0) daysHtml = `<span class="shw-days">きょう まで！</span>`;
            else                 daysHtml = `<span class="shw-days">しめきり すぎたよ</span>`;
          }
          body += `<div class="shw-group">${escHtml(g.label)}${daysHtml}</div>`;
          g.items.forEach(it => {
            const done = summerItemDone(it, state);

            // subs があるものは 小さなチップと「3/21」のような進みぐあいを作る
            let subHtml = '';
            let miniHtml = '';
            if (it.subs) {
              const chips = it.subs.flatMap(sg => sg.chips);
              const chipDone = chips.filter(c => state[c.id]).length;
              miniHtml = `<span class="shw-mini">${chipDone}/${chips.length}</span>`;
              it.subs.forEach(sg => {
                subHtml += `
                  <div class="shw-subrow">
                    ${sg.label ? `<span class="shw-sublabel">${escHtml(sg.label)}</span>` : ''}
                    <div class="shw-chips">
                      ${sg.chips.map(c => `
                        <span class="shw-chip ${state[c.id] ? 'done' : ''}"
                              data-chip-id="${escHtml(c.id)}">${escHtml(c.label)}</span>`).join('')}
                    </div>
                  </div>`;
              });
            }

            body += `
              <div class="shw-item ${done ? 'done' : ''} ${it.subs ? 'has-subs' : ''}"
                   ${it.subs ? '' : `data-shw-id="${escHtml(it.id)}"`}>
                <span class="shw-check">${done ? '✅' : '⬜'}</span>
                <div class="shw-info">
                  <div class="shw-name">${escHtml(it.name)}${miniHtml}</div>
                  <div class="shw-note">${escHtml(it.note)}</div>
                  ${subHtml}
                </div>
              </div>`;
          });
        });
        if (allDone) body += `<div class="shw-alldone">🏆 なつやすみの しゅくだい ぜんぶ おわり！すごい！！</div>`;
        body += `<div class="shw-footnote">🌱 おうちのひとへ：あさがおの鉢は 8/31（月）〜9/6（日）に学校へ。クリアファイルに提出物を入れて持たせてください。</div>`;
      }

      panel.innerHTML = `
        <div class="shw-panel">
          <div class="shw-head" id="shw-toggle">
            🌻 なつやすみの しゅくだい
            <span class="shw-arrow">${collapsed ? '▶' : '▼'}</span>
            <span class="shw-progress">${doneCount}/${allItems.length} できた</span>
          </div>
          ${body}
        </div>`;

      // 見出しタップで たたむ／ひらく
      document.getElementById('shw-toggle').addEventListener('click', () => {
        const s = readSummerHw();
        s._collapsed = !collapsed;
        localStorage.setItem(SUMMER_HW_KEY, JSON.stringify(s));
        renderSummerHwPanel();
      });

      // 行タップで ✅ をつけたり けしたり する（チップの無い宿題だけ）
      panel.querySelectorAll('.shw-item[data-shw-id]').forEach(el => {
        el.addEventListener('click', () => {
          const s = readSummerHw();
          s[el.dataset.shwId] = !s[el.dataset.shwId];
          localStorage.setItem(SUMMER_HW_KEY, JSON.stringify(s));
          renderSummerHwPanel();
        });
      });

      // チップタップで 1つずつ すすめる（もう一度タップで もどる）
      panel.querySelectorAll('.shw-chip').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          const s = readSummerHw();
          s[el.dataset.chipId] = !s[el.dataset.chipId];
          localStorage.setItem(SUMMER_HW_KEY, JSON.stringify(s));
          renderSummerHwPanel();
        });
      });
    }

    /** XSS 対策：HTML 特殊文字をエスケープする */
    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    loadApps();
    renderSummerHwPanel();

    // いまのポイントをヘッダーに表示する
    document.getElementById('pts-num').textContent = Points.get();
  </script>
</body>
</html>
