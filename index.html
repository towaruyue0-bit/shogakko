<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>小学校 学習アプリ</title>
  <style>
    /* ─── 全体リセット ─────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Maru Gothic ProN', 'BIZ UDPGothic', 'MS PGothic', sans-serif;
      background: linear-gradient(135deg, #e0f0ff 0%, #fce4ff 100%);
      min-height: 100dvh;
      padding-bottom: 32px;
    }

    /* ─── ヘッダー ─────────────────────────────────────── */
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
      padding: 28px 16px 20px;
      position: relative;
      box-shadow: 0 4px 16px rgba(102,126,234,0.4);
    }
    .header-icon { font-size: 2.6rem; display: block; margin-bottom: 4px; }
    .header h1  { font-size: 1.55rem; font-weight: 900; letter-spacing: 0.05em; }
    .header p   { font-size: 0.88rem; opacity: 0.88; margin-top: 4px; }

    /* 管理ツールへのリンク（右上の小さいボタン） */
    .manage-btn {
      position: absolute;
      top: 14px; right: 14px;
      background: rgba(255,255,255,0.22);
      color: white;
      border: 1.5px solid rgba(255,255,255,0.4);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 0.72rem;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .manage-btn:hover { background: rgba(255,255,255,0.35); }

    /* ─── いまのポイント（タップで どうがタイマーへ） ───────── */
    .points-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      background: rgba(255,255,255,0.92);
      color: #7c5cff;
      font-weight: 900;
      font-size: 1rem;
      text-decoration: none;
      border-radius: 999px;
      padding: 8px 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.18);
      transition: transform 0.12s;
    }
    .points-pill:hover { transform: translateY(-2px); }
    .points-pill:active { transform: scale(0.96); }
    .points-pill .pts-num { font-size: 1.25rem; }

    /* ─── カテゴリ見出し ────────────────────────────────── */
    .category-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: #6b7a99;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 24px 16px 8px;
    }

    /* ─── アプリグリッド ────────────────────────────────── */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 0 14px;
    }
    @media (min-width: 480px) {
      .app-grid { grid-template-columns: repeat(3, 1fr); }
    }

    /* ─── アプリカード ──────────────────────────────────── */
    .app-card {
      background: white;
      border-radius: 20px;
      padding: 20px 12px 16px;
      text-align: center;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
      display: block;
      position: relative;
      overflow: hidden;
    }
    .app-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: var(--card-color, #667eea);
      border-radius: 20px 20px 0 0;
    }
    .app-card:active,
    .app-card:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 10px 28px rgba(0,0,0,0.14);
    }

    .app-icon {
      font-size: 2.8rem;
      display: block;
      margin-bottom: 8px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.12));
    }
    .app-name {
      font-size: 0.92rem;
      font-weight: 800;
      color: #2d3748;
      line-height: 1.3;
      margin-bottom: 4px;
    }
    .app-desc {
      font-size: 0.72rem;
      color: #718096;
      line-height: 1.4;
    }

    /* ─── 空メッセージ ──────────────────────────────────── */
    .empty-msg {
      text-align: center;
      padding: 48px 24px;
      color: #a0aec0;
      font-size: 0.95rem;
      line-height: 1.8;
    }
    .empty-msg span { font-size: 2.5rem; display: block; margin-bottom: 12px; }

    /* ─── フッター ──────────────────────────────────────── */
    .footer {
      text-align: center;
      margin-top: 28px;
      font-size: 0.7rem;
      color: #a0aec0;
    }

    /* ─── ローディング ──────────────────────────────────── */
    #loading {
      text-align: center;
      padding: 48px;
      font-size: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="header">
    <a class="manage-btn" href="manage.html">⚙ 管理</a>
    <span class="header-icon">📚</span>
    <h1 id="site-title">小学校 学習アプリ</h1>
    <p id="site-subtitle">いっしょにべんきょうしよう！</p>
    <a class="points-pill" href="apps/timer/">⭐ <span class="pts-num" id="pts-num">0</span> ポイント</a>
  </div>

  <div id="loading">⏳</div>
  <div id="app-container" style="display:none"></div>

  <div class="footer">
    <p id="footer-text"></p>
  </div>

  <!-- ポイント共通ライブラリ -->
  <script src="/shared/points.js"></script>
  <script>
    /**
     * apps.json を読み込んで、アプリ一覧をカードとして表示する。
     * カテゴリごとにグループ分けして表示する。
     */
    async function loadApps() {
      const loading = document.getElementById('loading');
      const container = document.getElementById('app-container');

      try {
        // apps.json を取得（サーバー経由で動作）
        const res = await fetch('apps.json?t=' + Date.now());
        const data = await res.json();

        // ヘッダーのタイトルを設定
        if (data.title)    document.getElementById('site-title').textContent    = data.title;
        if (data.subtitle) document.getElementById('site-subtitle').textContent = data.subtitle;
        document.title = data.title || '小学校 学習アプリ';

        // 表示対象のアプリだけ取り出す
        const apps = (data.apps || []).filter(a => a.visible !== false);

        if (apps.length === 0) {
          container.innerHTML = `
            <div class="empty-msg">
              <span>🎒</span>
              アプリがまだありません。<br>
              「⚙ 管理」から追加してください。
            </div>`;
          loading.style.display = 'none';
          container.style.display = 'block';
          return;
        }

        // カテゴリごとにグループ化
        const categories = {};
        apps.forEach(app => {
          const cat = app.category || 'その他';
          if (!categories[cat]) categories[cat] = [];
          categories[cat].push(app);
        });

        // カテゴリごとにカードを生成
        let html = '';
        Object.entries(categories).forEach(([catName, catApps]) => {
          html += `<div class="category-label">${catName}</div>`;
          html += `<div class="app-grid">`;
          catApps.forEach(app => {
            html += `
              <a class="app-card" href="${escHtml(app.url)}"
                 style="--card-color: ${escHtml(app.color || '#667eea')}">
                <span class="app-icon">${escHtml(app.icon || '📖')}</span>
                <div class="app-name">${escHtml(app.name)}</div>
                <div class="app-desc">${escHtml(app.description || '')}</div>
              </a>`;
          });
          html += `</div>`;
        });

        container.innerHTML = html;

      } catch (err) {
        // ファイルとして直接開いた場合はフォールバックメッセージを表示
        container.innerHTML = `
          <div class="empty-msg">
            <span>⚠️</span>
            サーバーを起動してから開いてください。<br>
            <small>「サーバー起動.bat」をダブルクリックして<br>表示されたURLにアクセスしてください。</small>
          </div>`;
      }

      loading.style.display = 'none';
      container.style.display = 'block';
    }

    /** XSS 対策：HTML 特殊文字をエスケープする */
    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    loadApps();

    // いまのポイントをヘッダーに表示する
    document.getElementById('pts-num').textContent = Points.get();
  </script>
</body>
</html>
